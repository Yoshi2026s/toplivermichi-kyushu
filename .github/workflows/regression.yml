name: Regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:check
      - run: npm test
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-world-audio.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-world-save.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-world-walking-route.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-world-route-cues.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-world-polish.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-world-ui.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-map-ui.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-map-visibility.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-smooth-runtime.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-controls-navigation.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-followup-ui.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-review-actions-ui.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-mobile-copy.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-list-search-ui.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-mobile-facilities-ui.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-menu-return.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-screen-clarity.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-mobile-usability.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-photo-layout.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-pet-battle-fix-ui.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-pet-complete-ui.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-queued-mobile-ui.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-result-overview.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-result-reading.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: npm run test:battle-ui
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-illustrated-ui.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-title.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-title-autoplay.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-title-music.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-title-focus.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-title-volume-state.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-jingle-pause.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-sound-comfort.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-settings-continuity.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-effect-balance.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-ui-feedback.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-audio-render.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-music.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-world-backgrounds.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-regional-towns.mjs
        env:
          MOBILE_BROWSER: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-emulation
          include-hidden-files: true
          path: |
            .task/mobile-facilities/*.png
            .task/mobile-facilities/report.json
            .task/focus-visibility/*.png
            .task/focus-visibility/report.json
            .task/menu-return/*.png
            .task/menu-return/report.json
            .task/screen-clarity/*.png
            .task/screen-clarity/report.json
            .task/mobile-usability/*.png
            .task/mobile-usability/audit.json
            .task/smooth-runtime/*.png
            .task/smooth-runtime/report.json
            .task/map-visibility/*.png
            .task/map-visibility/report.json
            .task/photo-layout/*.png
            .task/photo-layout/report.json
            .task/pet-rarity/*.png
            .task/pet-rarity/report.json
            .task/pet-next/*.png
            .task/pet-next/report.json
            .task/pet-complete/*.png
            .task/pet-complete/report.json
            .task/queued-mobile/*.png
            .task/queued-mobile/report.json
            .task/list-search/*.png
            .task/list-search/report.json
            .task/mobile-copy/*.png
            .task/mobile-copy/report.json
            .task/review-actions/*.png
            .task/review-actions/report.json
            .task/followup-ui/*.png
            .task/followup-ui/report.json
            .task/controls-navigation/*.png
            .task/controls-navigation/report.json
            .task/regional-qa/*.png
            .task/regional-qa/report.json
            .task/music-qa/report.json
            .task/settings-continuity/*.png
            .task/settings-continuity/report.json
            .task/effect-balance/report.json
            .task/audio-render/*.wav
            .task/audio-render/*.json
            .task/sound-comfort/*.png
            .task/sound-comfort/report.json
            .task/ui-feedback/*.png
            .task/ui-feedback/report.json
            .task/world-qa/*.png
            .task/world-qa/report.json
            .task/title-qa/*.png
            .task/title-qa/report.json
            .task/title-music-qa/*.png
            .task/title-music-qa/report.json
            .task/title-focus/*.png
            .task/title-focus/report.json
            .task/title-volume-state/*.png
            .task/title-volume-state/report.json
            .task/jingle-pause/report.json
            .task/illustrated-*.png
            .task/illustrated-ui-report.json
            .task/battle-initial-*.png
            .task/world-walking-route/*.png
            .task/world-walking-route/report.json
            .task/world-route-cues/*.png
            .task/world-route-cues/report.json
            .task/world-polish/*.png
            .task/world-polish/report.json
            .task/world-save/*.png
            .task/world-save/report.json
            .task/world-ui/*.png
            .task/world-ui/report.json
            .task/world-audio/report.json
            .task/result-overview/*.png
            .task/result-overview/report.json
            .task/result-reading/*.png
            .task/result-reading/report.json
            .task/battle-boss-*.png
            .task/battle-viewport-layout.json
            .task/battle-readability-*.png
            .task/result-readability-*.png
            .task/mobile/reports/latest.json
            .task/mobile/reports/run-*/*.json
            .task/mobile/reports/run-*/*.png
          if-no-files-found: ignore
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-focus-visibility.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-command-groups.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-notice-input.mjs
        env:
          MOBILE_BROWSER: chromium
      - run: node scripts/test-readonly-clarity.mjs
        env:
          MOBILE_BROWSER: chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus-visibility
          include-hidden-files: true
          path: |
            .task/focus-visibility/
            .task/command-groups/
            .task/notice-input/
            .task/readonly-clarity/
          if-no-files-found: ignore
