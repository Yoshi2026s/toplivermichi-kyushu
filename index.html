}

/* 戦闘：1画面に収める（縦スクロールなし）。上から 状態→敵→味方→コマンド→ログ */
body.in-battle{padding-top:6px;padding-bottom:calc(var(--dockH) + 6px + env(safe-area-inset-bottom,0px));margin:0}
.battle{display:flex;flex-direction:column;gap:6px;height:calc(100dvh - 12px - var(--dockH) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));font-size:15px;line-height:1.35;overflow:hidden}
@supports not (height:100dvh){.battle{height:calc(100vh - 12px - var(--dockH))}}

@media (max-height:700px){.cue,.cue.on{font-size:12px}.bhead{font-size:12px}.pstat{font-size:12px}.pjob{display:none}.esprite.boss{width:60px}.bhead{font-size:13px}.ename{font-size:14px}.esprite{width:32px;height:32px}.pcard{min-height:44px}.cmd .cmdgrid .btn{min-height:40px}.chip{min-height:36px}.log span:first-child:nth-last-child(3){display:none}}
.pop{position:absolute;right:8px;top:2px;font-family:var(--f-dot);font-size:20px;font-weight:700;pointer-events:none;animation:popup .9s steps(6) forwards;text-shadow:2px 2px 0 var(--ink);z-index:3}

.sname{font-size:18px}

.bar.wide{height:8px;margin-bottom:2px}
/* ジョイコントローラー（画面下に固定） */
body.no-dock{--dockH:0px}
body.no-dock .dock{display:none}
body{padding-bottom:calc(var(--dockH) + 12px)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--dockH);box-sizing:content-box;padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));background:var(--ink);border-top:3px double var(--mist);display:flex;align-items:center;justify-content:space-between;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.dock>*{max-width:480px}
.stick{position:relative;width:92px;height:92px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--slate) 0 38%,var(--navy) 39% 100%);border:3px solid var(--cream);box-shadow:inset 0 0 0 3px var(--ink);touch-action:none;cursor:pointer}

.abtns{display:flex;align-items:center;gap:10px;flex:none}
.pbtn{font:inherit;width:58px;height:58px;border-radius:50%;border:3px solid var(--cream);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--ink);touch-action:manipulation}
.pbtn b{font-family:var(--f-dot);font-size:20px}.pbtn small{font-size:11px;margin-top:2px}
.pbtn.a{background:var(--red);width:66px;height:66px}

.overlay{padding-bottom:calc(12px + var(--dockH) + env(safe-area-inset-bottom,0px))!important}

.padside .btn{font-size:15px;text-align:center}

.result{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}

.rbanner.boss h2{color:var(--coral)}
.rbanner p{margin:2px 0 0;font-size:15px;color:var(--cream)}
.rlevel{background:#3A2E1A;border:2px solid var(--gold);padding:4px 10px;text-align:center;font-size:17px;display:flex;flex-direction:column;gap:0}
.rlevel b{font-family:var(--f-dot);color:var(--gold)}
body:not(.reduce-motion) .rlevel{animation:rpulse 1.2s steps(4) 2}
@keyframes rpulse{50%{box-shadow:0 0 0 4px rgba(213,179,76,.45)}}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rstat{background:var(--ink);border:2px solid var(--slate);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.rlab{font-size:13px;color:var(--sand)}
.rval{font-family:var(--f-dot);font-size:clamp(17px,5.4vw,22px);color:var(--cream);font-variant-numeric:tabular-nums;white-space:nowrap}
.rstat.gold .rval{color:var(--gold)}
.rxp{grid-template-columns:auto 1fr auto}
.bar.xp{height:10px}.bar.xp i{background:var(--gold)}
.bar.jp i{background:var(--violet)}
.bar.cp i{background:var(--sea)}
.rquest{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;background:var(--ink);border:2px solid var(--slate);padding:6px 8px;font-size:15px}
.rquest.done{display:block;border-color:var(--aqua);color:var(--aqua);text-align:center;font-family:var(--f-dot)}
.rbox{background:var(--ink);border:2px solid var(--gold);padding:6px 10px}
.rbox .label{font-size:16px;margin:0 0 4px}
.rlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:16px}
.rst{color:var(--gold);margin-right:6px;font-size:13px}
.rnote{margin:0}
.rmems{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rmem{background:var(--ink);border:2px solid var(--slate);padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rmem.low{border-color:var(--red);background:#3A1A1E}
.rmem.low .bar:not(.jp):not(.cp) i{background:var(--red)}
.rmem p{margin:0}
.rmh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.rmh b{font-size:16px}
.rbadge{font-family:var(--f-dot);font-size:12px;background:var(--gold);color:var(--ink);padding:0 4px}
.rmem .gauge{font-size:13px;grid-template-columns:5.2em 1fr auto}.rmem .gauge>span:first-child{white-space:nowrap}
.rlevel .big{font-size:22px}
.rfoot{position:sticky;bottom:calc(var(--dockH) + 8px + env(safe-area-inset-bottom,0px));z-index:2;background:linear-gradient(180deg,transparent,var(--ink) 30%);padding-top:10px}
.confirmrow .btn.auto{min-width:64px;background:var(--navy);border-color:var(--gold);color:var(--gold);font-family:var(--f-dot)}
.autopanel{border-color:var(--gold)}
.autotitle{font-family:var(--f-dot);color:var(--gold);font-size:18px;letter-spacing:.1em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.autotitle{animation:none}}
.autolast{font-size:16px;color:var(--aqua);min-height:1.4em}
.confirmrow .btn.stopauto{min-width:140px}
.quake{animation:quake .4s steps(8)}
@keyframes quake{0%{transform:translate(0,0)}12%{transform:translate(-6px,3px)}25%{transform:translate(5px,-3px)}37%{transform:translate(-4px,-2px)}50%{transform:translate(4px,3px)}62%{transform:translate(-3px,1px)}75%{transform:translate(2px,-2px)}100%{transform:none}}
.hurtflash{position:fixed;inset:0;z-index:25;pointer-events:none;background:var(--red);opacity:.28;animation:hf .26s steps(2) forwards}
@keyframes hf{to{opacity:0}}
/* 体力が最大の30%以下：ステータス欄を赤に */
.pcard.low,.pmini.low,.scard.low{border-color:var(--red)!important;background:#3A1A1E}
.pmini.low{background:transparent;color:var(--coral)}
.pcard.low .pstat,.pcard.low .pline b,.scard.low .kv dd{color:var(--coral)}
.pcard.low .bar i,.pmini.low .bar i,.scard.low .bar i{background:var(--red)}
.pstrip:has(.pmini.low){border-color:var(--red)}
@media (prefers-reduced-motion:reduce){.quake,.hurtflash{animation:none}.hurtflash{display:none}}
/* 配信 */
.meter{position:relative;height:16px;background:var(--ink);border:2px solid var(--cream)}
.meter i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,#B89A3E 8px 10px)}
.meter .line{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--coral)}
.comments{display:flex;flex-direction:column;gap:4px}
.cmt{background:var(--cream);color:var(--ink);padding:4px 8px;font-size:16px;border-left:4px solid var(--red)}
.req{font-weight:700}
.big{font-family:var(--f-dot);font-size:28px;color:var(--gold)}
.flash{position:fixed;inset:0;background:var(--cream);z-index:50;animation:fl .38s steps(4)}
@keyframes fl{0%,50%{opacity:1}25%,75%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash,.hitfx{animation:none}}

/* タイル: T木 .草(安全) ,道(安全) ~水 #壁 w床 1/2/3危険 =橋 c屋根 */
function buildMap(w,h,ops){
  const g=[]; for(let y=0;y<h;y++){g.push(new Array(w).fill("T"));}
  for(const [t,x,y,ww,hh] of ops){ for(let j=y;j<y+hh;j++) for(let i=x;i<x+ww;i++) if(g[j]&&i>=0&&i<w) g[j][i]=t; }
  return g;
}

const XP_CAP = 10029900, JP_CAP = 1997996;
const xpFor = L => 10*(L-1)*(L+6);
const jpFor = R => 2*R*(R+1)-4;
function levelOf(xp){ let lo=1,hi=999; while(lo<hi){const m=(lo+hi+1)>>1; if(xpFor(m)<=xp) lo=m; else hi=m-1;} return lo; }
function rankOf(jp){ let lo=1,hi=999; while(lo<hi){const m=(lo+hi+1)>>1; if(jpFor(m)<=jp) lo=m; else hi=m-1;} return lo; }
const Vof = L => 1+Math.floor((L-1)/20);
const Kof = R => R>=10?3:R>=6?2:R>=3?1:0;

function transferVaultGold(st,mode,amount){
  if(!["deposit","withdraw"].includes(mode)||!Number.isSafeInteger(amount)||amount<1) return false;
  if(!Number.isSafeInteger(st.gold)||st.gold<0||!Number.isSafeInteger(st.vaultGold)||st.vaultGold<0) return false;
  const from=mode==="deposit"?st.gold:st.vaultGold;
  const to=mode==="deposit"?st.vaultGold:st.gold;
  if(amount>from||!Number.isSafeInteger(to+amount)) return false;
  if(mode==="deposit"){st.gold-=amount;st.vaultGold+=amount;}
  else {st.vaultGold-=amount;st.gold+=amount;}
  return true;
}

/* ---- 能力の導出（第16E・16G・17A節） ---- */
function jpOf(st,cid,job){ return (st.jp[cid]&&st.jp[cid][job])||0; }
function charStats(st, cid, L, jobOverride, equipOverride){
  const job = jobOverride || st.jobs[cid];
  const R = rankOf(jpOf(st,cid,job));
  const V = Vof(L);
  const eq = equipOverride || st.equip[cid];
  const w = eq.w?EQUIP[eq.w]:null, a = eq.a?EQUIP[eq.a]:null, acc = eq.acc?EQUIP[eq.acc]:null;
  const ok = it => it && (!it.job || (it.job===job && R>=it.needR));
  const W = ok(w)?w:null, A = ok(a)?a:null, X = acc;
  const S = Kof(R) + (W && W.job===job ? 1 : 0);
  const supportHP = 0;
  const maxHP = 50+6*(L-1) + 2*Math.floor(R/2) + V*(((A&&A.hp)||0)+((X&&X.hp)||0)+supportHP);
  const startC = Math.min(10, 8+(R>=5?1:0)+((W&&W.c)||0)+((A&&A.c)||0)+((X&&X.c)||0));
  return { job, R, S, V, maxHP, startC,
    wAtk:(W&&W.atk)||0, accAtk:(X&&X.atk)||0, armorD:(A&&A.d)||0,
    commentA:((W&&W.commentA)||0)+((X&&X.commentA)||0),
    rest:((A&&A.rest)||0)+((X&&X.rest)||0),
    meter:((W&&W.meter)||0)+((X&&X.meter)||0),
    family:((W&&W.family)||0)+((X&&X.family)||0),
    pouch:!!(X&&X.pouch), jobWeapon: !!(W && W.job===job) };
}

/* ---- 乱数（抽選値はcommandへ固定する） ---- */
function rand16(){ try{ const a=new Uint32Array(1); crypto.getRandomValues(a); return a[0]; }catch(e){ return Math.floor(Math.random()*4294967296); } }
function randInt(n){ // 0..n-1 一様（棄却法）
  const lim = Math.floor(4294967296/n)*n; let r; do{ r=rand16(); }while(r>=lim); return r%n;
}

function enemyDef(areaId, idx){ // idx 0..49
  const ar = AREAS[areaId]; const [pn, rr] = ar.list[idx]; const p = PROFILES[pn-1];
  return { id:`EN-${areaId}-${String(idx+1).padStart(3,"0")}`, areaId, profile:p[0], name:`${ar.prefix}の${p[1]}`,
    species:p[2], attr:p[3], type:p[4], baseHP:p[5], baseDEF:p[6], cycle:p[7], trait:p[8], counter:p[9],
    rarity:rr, weight:[0,250,200,125,60,20][rr], q:ar.q };
}
function pickEnemyIndex(areaId, r){ // r: 0..9999
  const ar=AREAS[areaId]; let acc=0;
  for(let i=0;i<50;i++){ acc+=[0,250,200,125,60,20][ar.list[i][1]]; if(r<acc) return i; }
  return 49;
}
function letters(i){ let s=""; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26);} return s; }
function assignLabels(enemies){
  const groups={}; enemies.forEach(e=>{ (groups[e.id]=groups[e.id]||[]).push(e); });
  Object.values(groups).forEach(g=>{ g.sort((a,b)=>a.slot-b.slot); g.forEach((e,i)=>{ e.display = g.length===1? e.name : `${e.name} ${letters(i)}`; }); });
}

function baseRun(st, kind){
  const L = levelOf(st.xp), diff = DIFFICULTY[st.settings.difficulty];

    state:"input", rewardsApplied:false, bag:clone(st.bag||[]) };
}
function createFieldRun(st, areaId, rolls){ // rolls: {count:0|1, picks:[r0,r1]}
  const run = baseRun(st,"field"); const ar=AREAS[areaId]; const q=ar.q; const diff=DIFFICULTY[run.difficulty];
  run.areaId=areaId; run.q=q; run.hub=areaId.slice(0,4); run.returnPos={map:st.mapId,x:st.pos.x,y:st.pos.y};
  const n = rolls.count+1;
  for(let s=0;s<n;s++){
    const d = enemyDef(areaId, pickEnemyIndex(areaId, rolls.picks[s]));
    const hp = Math.ceil((d.baseHP+12*(q-1))*diff.hp);
    run.enemies.push({ slot:s, id:d.id, name:PROFILES[d.profile.slice(1)-1][1], fullName:d.name, profile:d.profile, species:d.species, attr:d.attr, rarity:d.rarity,
      maxHP:hp, hp, def:d.baseDEF+Math.floor((q-1)/12),
      cycle:d.cycle.map(([t,p])=>({t, p: t==="c"?0:Math.ceil((p+Math.floor(4*(q-1)/5))*diff.atk)})) });
  }
  assignLabels(run.enemies);
  return run;
}
function createBossRun(st, bossId){
  const run = baseRun(st,"boss"); const b=BOSSES[bossId]; const q=b.q; const diff=DIFFICULTY[run.difficulty];
  run.bossId=bossId; run.areaId=b.areaId; run.q=q; run.hub=b.hub; run.returnPos={map:st.mapId,x:st.pos.x,y:st.pos.y};
  // 少人数補正：戦闘開始時の人数で固定（4人で指示書どおり）
  const ps = bossScale(bossId, run.party.length);
  run.partyScale = ps;
  const hp = Math.ceil((100+36*q)*diff.hp*ps.hp);
  run.enemies.push({ slot:0, id:bossId, name:b.name, display:b.name, boss:true, maxHP:hp, hp, def:3+Math.floor(q/10),
    cycle:[{t:"s",p:12+q},{t:"a",p:6+Math.floor(q/2)},{t:"c",p:0},{t:"a",p:10+3*q,heavy:true}], atkMult:diff.atk*ps.atk });
  run.cue = {kind:b.cue, bits:[], ready:false, active:false};
  return run;
}

/* ---- 予告（第08・11D節） ---- */
function alive(run){ return run.party.filter(p=>p.hp>0); }
function pickTarget(run, seed){
  const candidates=run.party.map((p,i)=>({p,i,weight:run.party.length-i})).filter(x=>x.p.hp>0);
  if(!candidates.length) return -1;
  const total=candidates.reduce((n,x)=>n+x.weight,0);
  let cursor=((seed%total)+total)%total;
  for(const x of candidates){ if(cursor<x.weight) return x.i; cursor-=x.weight; }
  return candidates[0].i;
}
function enemyAction(run, e){
  const step = e.cycle[(run.turn-1)%e.cycle.length];
  let power = step.p;
  if(e.boss){

/* 確定（validate → reduce）。戻り値はログ配列 */

    }
    if(restored.length && act.type==="guard") run.actionFlags.mpGuard=true;
    if(restored.length && act.type==="rest") run.actionFlags.mpRest=true;
    if(restored.length && act.type==="skill") run.actionFlags.mpSkill=true;
    if(restored.length && act.type==="item") run.actionFlags.mpItem=true;
    if(restored.some(g=>run.party[g.pos].c-(g.pos===idx?p.cost.c:0)<=2)) run.actionFlags.mpLow=true;
    if(act.type==="guard") run.actionFlags.guardUsed=true;
    if(act.type==="guard" && Array.isArray(run.actionFlags.guardActors) && !run.actionFlags.guardActors.includes(run.party[idx].cid)) run.actionFlags.guardActors.push(run.party[idx].cid);
    if(Array.isArray(run.actionFlags.actionTypes) && !run.actionFlags.actionTypes.includes(act.type)) run.actionFlags.actionTypes.push(act.type);
    if(act.type==="skill" && Array.isArray(run.actionFlags.skills) && !run.actionFlags.skills.includes(run.party[idx].job)) run.actionFlags.skills.push(run.party[idx].job);
    if(!run.actionFlags.actors.includes(run.party[idx].cid)) run.actionFlags.actors.push(run.party[idx].cid);
    if(!run.actionFlags.jobs.includes(run.party[idx].job)) run.actionFlags.jobs.push(run.party[idx].job);

  for(const w of p.ward){ const t=run.party[w.pos]; if(w.amt>0){ t.ward=Math.min(8,t.ward+w.amt); log.push(`${t.name}に防護${w.amt}`); } }

    run.cue.bits.push(a.cid);

function enemyPhase(run){

    if(act.type==="c"){ log.push(`${e.display}は力をためている。`); continue; }
    if(run.actionHistoryComplete===true && run.actionFlags) run.actionFlags.enemyAttacked=true;
    const targets = act.type==="a" ? alive(run) : [run.party[act.target]].filter(Boolean);
    for(const t of targets){

        if(t.guard) flags.guardHit=true;
        if(t.ward>0) flags.wardHit=true;
        if(inc===0) flags.zeroHit=true;
        if(act.heavy && t.guard) flags.heavyGuardHit=true;
      }
      t.hp = Math.max(0, t.hp-inc);
      if(inc>0 && t.hp>0 && t.hp<=t.maxHP*0.3 && run.actionHistoryComplete===true && run.actionFlags) run.actionFlags.criticalSurvive=true;
      if(t.hp===0 && run.actionHistoryComplete===true && run.actionFlags) run.actionFlags.downSeen=true;
      log.push(`${e.display}の${act.type==="a"?"全体攻撃":"攻撃"}。${t.name}に${inc}。`+(t.hp===0?` ${t.name}は戦闘不能。`:""));
    }
    if(alive(run).length===0){ run.state="lost"; log.push("全員が戦闘不能になった……"); return log; }

  if(run.cue && run.turn%4===0){ run.cue.bits=[]; run.cue.ready=false; }
  for(const m of run.party){ m.guard=false; m.ward=0; m.acted=false; }
  run.turn++; run.chain={stage:0,members:[]};

  return log;
}

/* ---- 戦闘報酬（第17B・17H節）。一度だけ適用 ---- */
function applyVictory(st, run){
  const res = { xp:0, gold:0, tickets:0, jp:[], levelBefore:levelOf(st.xp), levelAfter:0, gifts:[], quest:null, kills:0, notes:[] };
  if(run.rewardsApplied) return res;
  storeVitals(st, run); st.bag = clone(run.bag||st.bag||[]); res.items=[]; res.itemsKept=[]; res.itemsLost=[];
  const L0 = levelOf(st.xp); const max0 = Object.fromEntries(st.roster.map(cid=>[cid,charStats(st,cid,L0).maxHP]));
  const n = run.enemies.length;
  if(run.kind==="field"){
    res.xp = Math.min(XP_CAP-st.xp, n*(8+3*run.q)); res.gold = n*(20+2*run.q);
    st.xp += res.xp; st.gold += res.gold;
    for(const e of run.enemies) st.killCount[e.id]=(st.killCount[e.id]||0)+1;
    // 道具のドロップ：倒した敵ごとに1回だけ抽選（1体から最大1個）
    for(const e of run.enemies){ const dr=ITEM_DROPS[e.id]; if(!dr) continue;
      const roll = run.dropRolls && run.dropRolls[e.slot]!=null ? run.dropRolls[e.slot] : randInt(dr[1]);
      if(roll===0) giveItem(st, dr[0], 1, res, `${e.display}が落とした`); }
    // 依頼の討伐数
    const qid = st.activeQuest;
    if(qid && QUESTS[qid].hub===run.hub && ["active"].includes(st.quests[qid])){
      st.qprog[qid]=Math.min(QUESTS[qid].kills,(st.qprog[qid]||0)+n);
      res.kills=n; res.killQuest=qid; res.killNow=st.qprog[qid]; res.killNeed=QUESTS[qid].kills;
      if(st.qprog[qid]>=QUESTS[qid].kills){
        if(QUESTS[qid].main){ st.quests[qid]="bossReady"; res.notes.push(`${qid}：ボスに挑めるようになった。`); }
        else { completeQuest(st,qid,res); }
      }
    }
  }
  // JP
  for(const m of run.party){
    const base = run.turn<=3 ? 12 : 6+2*Math.min(3,m.valid);
    const cur = jpOf(st,m.cid,m.job); const R0=rankOf(cur);
    const gain = Math.min(JP_CAP-cur, base); st.jp[m.cid][m.job]=cur+gain; const R1=rankOf(cur+gain);
    res.jp.push({cid:m.cid, name:m.name, job:m.job, gain, R0, R1});
    if(R0<4 && R1>=4) giftCheck(st,m.job,"W",res);
    if(R0<7 && R1>=7) giftCheck(st,m.job,"A",res);
  }
  if(run.kind==="boss"){
    st.bossDefeated[run.bossId]=true;
    const qid = Object.keys(QUESTS).find(k=>QUESTS[k].boss===run.bossId);
    if(qid && st.quests[qid]==="bossReady"){
      if(QUESTS[qid].stream){ st.quests[qid]="combatDone"; res.notes.push("配信の準備が整った。"); }
      else completeQuest(st,qid,res);
    }
  }
  res.levelAfter = levelOf(st.xp);
  // レベルが上がった分だけ現在の体力も増やす（戦闘不能のままは増やさない）
  for(const cid of st.roster){ const v=st.vitals[cid]; if(v&&v.hp>0){ const d=charStats(st,cid,res.levelAfter).maxHP-max0[cid]; if(d>0) v.hp+=d; } }
  ensureVitals(st);
  run.rewardsApplied = true;
  return res;
}
function giftCheck(st, job, kind, res){
  if(st.gifts[kind][job]) return;
  st.gifts[kind][job]=true; const id=(kind==="W"?"JW":"JA")+job.slice(1);
  st.owned[id]=Math.min(8,(st.owned[id]||0)+1); res.gifts.push(id);

function completeQuest(st, qid, res){
  if(st.quests[qid]==="complete") return;

  const xp = Q.main?40:10, tk = Q.main?200:80;
  const ev = ITEM_EVENTS[qid]; if(ev) giveItem(st, ev[0], ev[1], res, `依頼${qid}の達成`);
  st.xp=Math.min(XP_CAP, st.xp+xp); st.tickets+=tk;

/* ---- 名前の検証（第06E節。文字数はユーザー指定で1～12文字） ---- */
const NAME_MAX = 12;
const HW_KANA = "｡｢｣､･ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";
const FW_KANA = "。「」、・ヲァィゥェォャュョッーアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン";
function normalizeName(raw){
  let s = raw.replace(/^[ 　]+|[ 　]+$/g,"");
  s = s.replace(/[A-Za-z0-9]/g, ch=>String.fromCharCode(ch.charCodeAt(0)+0xFEE0));
  let out="";
  for(let i=0;i<s.length;i++){
    const ch=s[i], k=HW_KANA.indexOf(ch);
    if(k>=0){ let f=FW_KANA[k]; const nx=s[i+1];
      if(nx==="ﾞ"){ const v=(f+"゙").normalize("NFC"); if(v.length===1){ f=v; i++; } }
      else if(nx==="ﾟ"){ const v=(f+"゚").normalize("NFC"); if(v.length===1){ f=v; i++; } }
      out+=f; }
    else if(ch==="ﾞ") out+="゙"; else if(ch==="ﾟ") out+="゚";
    else out+=ch;
  }
  return out.normalize("NFC");
}
function graphemes(s){
  try{ if(Intl.Segmenter) return Array.from(new Intl.Segmenter("ja",{granularity:"grapheme"}).segment(s), x=>x.segment); }catch(e){}
  return Array.from(s.normalize("NFC"));
}
function nameCharOk(g){
  if(g.length>2) return false;
  if([...g].length!==1) return false;
  const c=g.codePointAt(0);
  if(c>=0x3041&&c<=0x3096) return true;
  if(c>=0x30A1&&c<=0x30FA) return true;
  if("々〆〇ーゝゞヽヾ".includes(g)) return true;
  if((c>=0xFF21&&c<=0xFF3A)||(c>=0xFF41&&c<=0xFF5A)||(c>=0xFF10&&c<=0xFF19)) return true;
  try{ return /^\p{Script=Han}$/u.test(g); }catch(e){ return (c>=0x4E00&&c<=0x9FFF)||(c>=0x3400&&c<=0x4DBF)||(c>=0x20000&&c<=0x2FFFF)||(c>=0xF900&&c<=0xFAFF); }
}
function validateName(raw){
  const s=normalizeName(raw); const gs=graphemes(s); const errors=[];
  gs.forEach((g,i)=>{ if(!nameCharOk(g)) errors.push(`${i+1}文字目「${/\s/.test(g)?"空白":g}」は使えません（使える文字：ひらがな・カタカナ・漢字・全角英数字）。`); });
  if(gs.length===0) errors.push("名前を入力してください。");
  if(gs.length>NAME_MAX) errors.push(`${gs.length}文字です。${NAME_MAX}文字以内に直してください。`);
  return { value:s, count:gs.length, errors, ok:errors.length===0 };
}

/* ---- 戦闘オートのAI（ユーザー指定）：候補行動を複製上で試し、評価が最も高い行動を選ぶ ---- */
function aiCandidates(run, a){
  const out=[]; const en=run.enemies.filter(e=>e.hp>0).map(e=>e.slot);
  const al=run.party.filter(m=>m.hp>0).map(m=>m.pos), others=al.filter(p=>p!==a.pos), all=run.party.map(m=>m.pos);
  en.forEach(t=>out.push({type:"attack",target:t}));
  ["greet","plan","thanks"].forEach(l=>out.push({type:"comment",line:l}));
  out.push({type:"guard"},{type:"rest"},{type:"meter"},{type:"family"});
  // オートでは購入可能な低レア回復品だけを検討する。所持品や乱数は候補探索中に変更しない。
  const downs=run.party.filter(m=>m.hp<=0).map(m=>m.pos);
  for(const e of (run.bag||[])){ const it=ITEMS[e.id]; if(!it||e.n<=0||it.stars>2||it.price<=0||!['S','SD'].includes(it.acq)||it.cat==="攻撃") continue;
    const nd=itemNeeds(it), effect=it.eff[0];
    const needsHelp=m=>m.hp>0&&((effect.includes('hp')&&m.hp/m.maxHP<=0.85)||(effect.includes('c')&&m.c/10<=0.7));
    if(nd==="ally") run.party.filter(needsHelp).forEach(m=>out.push({type:"item",item:e.id,ally:m.pos}));
    else if(nd==="down") downs.forEach(p=>out.push({type:"item",item:e.id,ally:p}));
    else if(nd==="downAll"&&downs.length) out.push({type:"item",item:e.id});
    else if(nd==="allyAll"&&run.party.some(needsHelp)) out.push({type:"item",item:e.id}); }
  const need={J01:"enemy",J02:"line",J03:"ally",J04:"mode",J05:"enemy",J06:"mode",J07:"none",J08:"ally",J09:"enemy",J10:"none",J11:"none",J12:"none",J13:"ally",J14:"none",J15:"enemy",J16:"enemy",J17:"none",J18:"ally",J19:"enemy",J20:"none",J21:"enemy",J22:"allyOther"}[a.job];
  if(need==="enemy") en.forEach(t=>out.push({type:"skill",target:t}));
  if(need==="ally") al.forEach(p=>out.push({type:"skill",ally:p}));
  if(need==="allyOther") others.forEach(p=>out.push({type:"skill",ally:p}));
  if(need==="line") ["greet","plan","thanks"].forEach(l=>out.push({type:"skill",line:l}));
  if(need==="none") out.push({type:"skill"});

    else en.forEach(t=>{ out.push({type:"skill",mode:"safe",target:t}); out.push({type:"skill",mode:"bold",target:t}); });
  }
  return out;
}
function aiIncoming(run, m){
  if(m.hp<=0) return 0; let sum=0;
  for(const t of telegraph(run)){
    if(t.type==="c") continue;
    if(t.type==="s" && t.target!==m.pos) continue;
    let inc=Math.max(0, t.power - run.V*(m.armorD+m.ward)); if(m.guard) inc=Math.ceil(inc/2); sum+=inc;
  }
  return sum;
}
function aiScore(before, after){
  if(after.state==="won") return 1e6 - after.turn*10;
  if(after.state==="lost") return -1e6;
  let s=0;
  // 敵へのダメージと撃破
  for(const e of after.enemies){ const b=before.enemies.find(x=>x.slot===e.slot); s += (b.hp-e.hp)*4; if(b.hp>0&&e.hp<=0) s+=120; if(e.hp>0) s -= e.hp*0.5; }
  // 味方の生存と体力（敵フェーズ前なら予告から被ダメージを見込む）
  const phaseDone = after.turn>before.turn;
  for(const m of after.party){
    const pred = phaseDone? 0 : aiIncoming(after,m);
    const eff = m.hp - pred;
    if(m.hp<=0) { s-=260; continue; }
    if(eff<=0) s-=220; else s += 150*Math.min(1,eff/m.maxHP) + 40;
    s += Math.min(m.c,10)*3 + (m.c<3?-15:0);
  }
  s += after.A*0.45 + after.B*3;
  if(after.cue && after.cue.ready && !(before.cue&&before.cue.ready)) s+=90;
  if(after.kiraDone && !before.kiraDone) s+=40;
  if(after.chain.stage>before.chain.stage) s+=12*after.chain.stage;
  return s;
}

function aiChoose(run){
  let best=null;
  for(const a of run.party){
    if(a.hp<=0||a.acted) continue;
    for(const act of aiCandidates(run,a)){
      const p=planAction(run,a.pos,act); if(!p.ok) continue;
      if(act.type==="item" && !aiItemUseful(run,p)) continue;
      const sim=JSON.parse(JSON.stringify(run)); sim.log=[];
      const r=applyAction(sim,a.pos,act); if(!r.ok) continue;
      if(act.type==="item"&&sim.state!=="won"){
        const netGain=sim.party.some((m,i)=>m.hp>run.party[i].hp||m.c>run.party[i].c);
        const newDown=sim.party.some((m,i)=>run.party[i].hp>0&&m.hp<=0);
        if(!netGain||newDown) continue;
      }
      let sc=aiScore(run,sim);
      const winning=sim.state==="won";
      if(act.type==="attack") sc+=0.5;            // 同点なら通常攻撃
      if(act.type==="item"){ const it=ITEMS[act.item]; sc -= 10 + 12*it.stars + Math.min(60,Math.max(it.price,it.sell,40)/4); } // 道具は数に限りがあるため控えめに（レアほど温存）
      if(!best||(winning&&!best.winning)||(winning===best.winning&&sc>best.score)) best={idx:a.pos, act, score:sc, winning, label:actLabel(run,a,act), name:a.name};
    }
  }
  return best;
}

/* ---- 道具袋（300種類×各99個。入らない分は金庫、次に預かり所へ） ---- */
function bagCount(bag,id){ const e=(bag||[]).find(x=>x.id===id); return e?e.n:0; }
function bagRoom(bag,id){ const e=bag.find(x=>x.id===id); if(e) return BAG_STACK-e.n; return bag.length<BAG_KINDS?BAG_STACK:0; }
function bagAdd(bag,id,n){ const add=Math.min(n,bagRoom(bag,id)); if(add<=0) return 0; const e=bag.find(x=>x.id===id); if(e) e.n+=add; else bag.push({id,n:add}); return add; }
function bagRemove(bag,id,n){ const i=bag.findIndex(x=>x.id===id); if(i<0) return 0; const r=Math.min(n,bag[i].n); bag[i].n-=r; if(bag[i].n<=0) bag.splice(i,1); return r; }
const ITEM_VAULT_MAX=999;
function itemVaultCount(st){ return (st.itemVault||[]).reduce((n,e)=>n+e.n,0); }
function itemVaultAdd(st,id,n){
  if(!ITEMS[id]||!Number.isSafeInteger(n)||n<1) return 0;
  st.itemVault=st.itemVault||[];
  const room=Math.max(0,ITEM_VAULT_MAX-itemVaultCount(st)),add=Math.min(n,room);
  if(!add) return 0;
  const e=st.itemVault.find(x=>x.id===id); if(e) e.n+=add; else st.itemVault.push({id,n:add});
  return add;
}
function transferVaultItem(st,mode,id,n){
  if(!["deposit","withdraw"].includes(mode)||!ITEMS[id]||!Number.isSafeInteger(n)||n<1||!Array.isArray(st.bag)||!Array.isArray(st.itemVault)) return false;
  const stored=bagCount(st.itemVault,id),total=itemVaultCount(st);
  if(!Number.isSafeInteger(total)||total>ITEM_VAULT_MAX||st.itemVault.some(e=>!ITEMS[e.id]||!Number.isSafeInteger(e.n)||e.n<1)) return false;
  if(mode==="deposit"){
    if(bagCount(st.bag,id)<n||total+n>ITEM_VAULT_MAX) return false;
    bagRemove(st.bag,id,n); itemVaultAdd(st,id,n);
  }else{
    if(stored<n||bagRoom(st.bag,id)<n) return false;
    bagRemove(st.itemVault,id,n); bagAdd(st.bag,id,n);
  }
  return true;
}
function giveItem(st,id,n,res,why){
  st.bag=st.bag||[]; st.keep=st.keep||[];
  const got=bagAdd(st.bag,id,n); let rest=n-got, vaulted=0, kept=0;
  if(rest>0){ vaulted=itemVaultAdd(st,id,rest); rest-=vaulted; }
  while(rest>0 && st.keep.length<KEEP_MAX){ st.keep.push(id); rest--; kept++; }
  if(res){ res.items=res.items||[]; res.itemsVaulted=res.itemsVaulted||[]; res.itemsKept=res.itemsKept||[]; res.itemsLost=res.itemsLost||[];
    if(got) res.items.push({id,n:got,why}); if(vaulted) res.itemsVaulted.push({id,n:vaulted}); if(kept) res.itemsKept.push({id,n:kept}); if(rest) res.itemsLost.push({id,n:rest}); }
  return {got,vaulted,kept,lost:rest};
}
function flushKeep(st){ // 預かり所から袋・金庫へ（安全地帯で呼ぶ）
  const moved={bagged:0,vaulted:0};
  if(!st.keep||!st.keep.length) return moved;
  const left=[];
  for(const id of st.keep){
    if(bagAdd(st.bag,id,1)) moved.bagged++;
    else if(itemVaultAdd(st,id,1)) moved.vaulted++;
    else left.push(id);
  }
  st.keep=left; return moved;
}
function itemAmount(it, k, maxHP, V, boost){
  const e=it.eff; let v=0;
  if(k==="hp"){ if(e[0]==="hp"||e[0]==="hpc") v=e[1]*V; else if(e[0]==="hp%"||e[0]==="hpc%") v=Math.ceil(maxHP*e[1]/100); }
  if(k==="rev"){ v=Math.ceil(maxHP*e[1]/100); }
  return boost? Math.ceil(v*1.5) : v;
}
function itemC(it, capRoom){ const e=it.eff; if(e[0]==="c") return e[1]; if(e[0]==="cfull") return capRoom; if(e[0]==="hpc") return e[2]; if(e[0]==="hpc%") return capRoom; return 0; }
function itemNeeds(it){ // 対象の種類
  if(it.cat==="攻撃") return it.target==="敵全体"?"enemyAll":"enemy";
  if(it.cat==="蘇生") return it.target.includes("全員")?"downAll":"down";
  return it.target.includes("全員")?"allyAll":"ally";
}
/* 戦闘中の道具（1行動。エール・コメント連携・JPの有効行動・初撃破エール・ボス対処には数えない） */
function planItem(run,a,act,p,h){
  const it=ITEMS[act.item]; p.item=act.item; p.chain=null;
  if(!it){ p.ok=false; p.reason="道具を選んでください。"; return; }
  if(bagCount(run.bag,it.id)<=0){ p.ok=false; p.reason="その道具は持っていません。"; return; }
  const need=itemNeeds(it), V=h.V, boost=a.pouch && it.cat!=="攻撃";
  const healOne=(t)=>{ const hp=itemAmount(it,"hp",t.maxHP,V,boost); if(hp) h.heal(t,hp); const cc=itemC(it,10-t.c); if(cc) h.addC(t,cc); };
  if(need==="enemy"||need==="enemyAll"){
    const list = need==="enemy" ? [h.needEnemy()].filter(Boolean) : run.enemies.filter(e=>e.hp>0);
    if(!list.length){ p.ok=false; p.reason="対象の敵を選んでください。"; return; }
    for(const e of list){ const d=Math.max(1, it.eff[1]*V - e.def); p.dmg.push({slot:e.slot, amt:Math.min(d,e.hp), raw:d}); }
    if(need==="enemyAll") p.all=true;
  } else if(need==="ally"){ const t=h.needAlly(); if(!t){ p.ok=false; p.reason="対象を選んでください。"; return; } healOne(t); }
  else if(need==="allyAll"){ for(const t of run.party.filter(m=>m.hp>0)) healOne(t); }
  else { // 蘇生
    const downs = run.party.filter(m=>m.hp<=0);
    const list = need==="downAll" ? downs : downs.filter(m=>m.pos===act.ally);
    if(!downs.length){ p.ok=false; p.reason="戦闘不能の仲間がいません。"; return; }
    if(!list.length){ p.ok=false; p.reason="復活させる仲間を選んでください。"; return; }
    for(const t of list) p.heal.push({pos:t.pos, amt:itemAmount(it,"rev",t.maxHP,V,boost), revive:true});
  }
  const effect = p.dmg.length || p.heal.some(x=>x.amt>0||x.revive) || p.cgain.some(x=>x.amt>0);
  if(!effect){ p.ok=false; p.reason="今は効果がありません。"; return; }
  p.valid=false; p.aGain=0;
}
/* 移動中の道具（攻撃道具は使えない）。集中力の上限は最大集中力 */
function useItemField(st, id, cid){
  const it=ITEMS[id]; if(!it) return {ok:false, reason:"道具がありません。"};
  if(it.battleOnly) return {ok:false, reason:"戦闘中だけ使える道具です。"};
  if(st.run) return {ok:false, reason:"戦闘中は戦闘の道具コマンドから使います。"};
  if(bagCount(st.bag,id)<=0) return {ok:false, reason:"その道具は持っていません。"};
  ensureVitals(st); const L=levelOf(st.xp), V=Vof(L), need=itemNeeds(it);
  const all = need==="allyAll"||need==="downAll";
  const targets = all ? st.roster.slice() : [cid];
  const log=[]; let any=false;
  for(const c of targets){
    const s=charStats(st,c,L), v=st.vitals[c]; if(!v) continue; const boost=s.pouch;
    if(need==="down"||need==="downAll"){ if(v.hp>0) continue; v.hp=Math.min(s.maxHP,itemAmount(it,"rev",s.maxHP,V,boost)); any=true; log.push(`${charName(st,c)}が復活（体力${v.hp}）`); continue; }
    if(v.hp<=0){ continue; }
    const hp=Math.min(itemAmount(it,"hp",s.maxHP,V,boost), s.maxHP-v.hp); const cc=Math.min(itemC(it,s.startC-v.c), s.startC-v.c);
    if(hp>0){ v.hp+=hp; any=true; log.push(`${charName(st,c)}の体力＋${hp}`); }
    if(cc>0){ v.c+=cc; any=true; log.push(`${charName(st,c)}の集中力＋${cc}`); }
  }
  if(!any) return {ok:false, reason: (need==="down"||need==="downAll") ? "戦闘不能の仲間がいません。" : "今は効果がありません（戦闘不能の人には回復道具が効きません）。"};
  bagRemove(st.bag,id,1);
  return {ok:true, log};
}

/* ===== art: ドット素材をコードで生成（16色パレット基調・新規デザイン） ===== */
const ART = (()=>{
  const cache = {};
  function mk(w,h){ const c=document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d"); g.imageSmoothingEnabled=false; return [c,g]; }
  const px=(g,x,y,w,h,col)=>{ g.fillStyle=col; g.fillRect(x,y,w,h); };
  function seeded(str){ let h=2166136261; for(const ch of String(str)){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%10000)/10000; }; }
  function hex(c){ const n=parseInt(c.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
  function mix(a,b,t){ const A=hex(a),B=hex(b); return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join(""); }
  const dark=(c,t=.3)=>mix(c,PAL.ink,t), light=(c,t=.3)=>mix(c,PAL.cream,t);
  /* 透明部分に接する画素を濃紺の輪郭にする */
  function outline(c, col=PAL.ink){
    const g=c.getContext("2d"), w=c.width, h=c.height, d=g.getImageData(0,0,w,h), a=d.data, src=new Uint8ClampedArray(a);
    const op=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&src[(y*w+x)*4+3]>200;
    const [r,gg,b]=hex(col);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=(y*w+x)*4; if(src[i+3]>200) continue;
      if(op(x-1,y)||op(x+1,y)||op(x,y-1)||op(x,y+1)){ a[i]=r;a[i+1]=gg;a[i+2]=b;a[i+3]=255; } }
    g.putImageData(d,0,0);
  }

  /* ---- 地形 16×16（周囲のタイルを見て縁を描く） ---- */
  const WATER="~=", SOLID="#cT";
  function drawTile(g, X, Y, t, nb, frame, seed){
    const r=seeded(seed); const P=(x,y,w,h,c)=>px(g,X+x,Y+y,w,h,c);
    const grass=()=>{ P(0,0,16,16,PAL.leaf);
      for(let i=0;i<5;i++){ const x=Math.floor(r()*14), y=Math.floor(r()*13); P(x,y+1,1,2,PAL.forest); P(x+1,y,1,2,PAL.forest); }
      if(r()<.18){ const x=2+Math.floor(r()*11), y=2+Math.floor(r()*11); P(x,y,1,1,r()<.5?PAL.coral:PAL.cream); P(x-1,y+1,1,1,PAL.forest); }
      if(r()<.3){ P(Math.floor(r()*15),Math.floor(r()*15),1,1,"#7E9A63"); } };
    switch(t){
      case ".": grass(); break;
      case ",": { P(0,0,16,16,PAL.sand);
        for(let y=0;y<16;y+=4) for(let x=((y/4)%2)*3-3;x<16;x+=6){ P(x+1,y+1,4,2,"#DFC394"); P(x,y+3,6,1,"#BE9E6E"); }
        if(r()<.3) P(Math.floor(r()*14),Math.floor(r()*14),2,1,PAL.skin);
        const g2=(d)=>!",=w123".includes(nb(d[0],d[1]))&&!WATER.includes(nb(d[0],d[1]))&&!SOLID.includes(nb(d[0],d[1]));
        if(g2([0,-1])) for(let x=0;x<16;x+=2) P(x,0,1,1+((x>>1)%2),PAL.leaf);
        if(g2([0,1])) for(let x=1;x<16;x+=2) P(x,15-((x>>1)%2),1,1+((x>>1)%2),PAL.leaf);
        if(g2([-1,0])) for(let y=0;y<16;y+=2) P(0,y,1+((y>>1)%2),1,PAL.leaf);
        if(g2([1,0])) for(let y=1;y<16;y+=2) P(15-((y>>1)%2),y,1+((y>>1)%2),1,PAL.leaf);
        break; }
      case "~": { P(0,0,16,16,PAL.sea);
        const o=frame%4; for(let k=0;k<3;k++){ const yy=(k*5+3)%16, xx=(k*7+o*2+Math.floor(seed.length))%16; P(xx,yy,4,1,PAL.aqua); P((xx+4)%16,yy+1,2,1,"#5E9AA5"); }
        if(o===1||o===3) P((seed.length*3+o)%15,(seed.length*5)%15,1,1,PAL.cream);
        const land=d=>!WATER.includes(nb(d[0],d[1]));
        if(land([0,-1])){ P(0,0,16,2,PAL.aqua); for(let x=(o%2);x<16;x+=3) P(x,2,1,1,PAL.cream); }
        if(land([-1,0])){ P(0,0,2,16,PAL.aqua); for(let y=(o%2);y<16;y+=3) P(2,y,1,1,PAL.cream); }
        if(land([1,0])){ P(14,0,2,16,PAL.aqua); for(let y=(o%2);y<16;y+=3) P(13,y,1,1,PAL.cream); }
        if(land([0,1])) P(0,15,16,1,PAL.aqua);
        break; }
      case "T": { grass();

    "水紋体":"drop","微粒体":"cloud","鉱殻体":"crystal","火花体":"spark","容器体":"jar","機材体":"box","紙積体":"box",

  };

  function inside(shape,x,y,S){
    const u=(x+0.5)/S*2-1, v=(y+0.5)/S*2-1;

      case "glyph": return (Math.abs(u)<0.78&&Math.abs(v+0.45)<0.17)||(Math.abs(u)<0.17&&Math.abs(v)<0.78)||(Math.abs(u-0.38)<0.16&&v>0&&v<0.78)||(Math.abs(v-0.2)<0.15&&Math.abs(u)<0.58);
      case "drop": return Math.hypot(u,(v-0.18)*1.05)<0.64 || (Math.abs(u)<0.64*(1-(v+0.85)/0.6) && v<-0.2 && v>-0.88);
      case "cloud": return Math.hypot(u+0.36,v)<0.44||Math.hypot(u-0.36,v)<0.44||Math.hypot(u,v+0.26)<0.47||Math.hypot(u,v-0.2)<0.4;
      case "crystal": return Math.abs(u)*1.1+Math.abs(v)*0.75<0.8;
      case "spark": { const a=Math.atan2(v,u), d=Math.hypot(u,v); return d < 0.44+0.34*Math.abs(Math.cos(a*3)); }
      case "jar": return (Math.abs(u)<0.62&&v>-0.35&&v<0.78) || (Math.abs(u)<0.32&&v<=-0.35&&v>-0.72);
      case "box": return Math.abs(u)<0.72&&Math.abs(v)<0.64;
      case "lantern": return (Math.hypot(u*0.8,v*0.62)<0.56) || (Math.abs(u)<0.13&&v<-0.6&&v>-0.88);
      case "coil": { const d=Math.hypot(u,v); const a=Math.atan2(v,u); return d<0.84 && (d<0.28 || Math.abs(((d*5 - a/Math.PI) % 2 + 2)%2 - 1) < 0.62); }
      case "ribbon": return Math.abs(v - 0.35*Math.sin(u*3.2)) < 0.28 && Math.abs(u)<0.88;
      case "sheet": return Math.abs(u+v*0.25)<0.62 && Math.abs(v)<0.74 && !(u>0.3&&v<-0.4);

    if(jingleT){ clearTimeout(jingleT); jingleT=null; }
    if(cur===name && (timer||!on)) return;
    cur=name; stopBgm();
    if(!on||!ac||!SONGS[name]) return;
    song=compile(SONGS[name]); step=0; nextT=ac.currentTime+0.06; if(dly) dly.delayTime.setValueAtTime(Math.min(1.2,60/song.bpm*0.75),ac.currentTime);
    schedule(); timer=setInterval(schedule,25);
  }
  /* ジングル：短い曲を1回鳴らし、終わったら next の曲へ（勝利・レベルアップ・全滅） */
  const JINGLES = {
    fanfare:{ bpm:150, lead:"C5 C5 C5 - C5 - G#4 - A#4 - C5 - A#4 C5 - - | G5 - - - - - . .", bass:"C3 . C3 . C3 . G#2 . A#2 . C3 . A#2 C3 . . | G2 - C3 - C2 - . ." , harm:"E4 E4 E4 - E4 - C4 - D4 - E4 - D4 E4 - - | B4 - - - - - . ." },
    levelup:{ bpm:168, lead:"G5 - B5 - D6 - G6 - | F#6 - D6 - A5 - D6 - | G6 - - - B6 - - - | G6 - - - - - . .", bass:"G3 - . - D3 - . - | D3 - . - F#3 - . - | G3 - . - D3 - . - | G2 - - - - - . .", harm:"D5 - G5 - B5 - D6 - | D6 - A5 - F#5 - A5 - | D6 - - - G6 - - - | D6 - - - - - . ." },
    lose:{ bpm:90, lead:"E5 - D#5 - D5 - C#5 - | C5 - - - B4 - - - | A4 - - - - - . .", bass:"A3 - - - G#3 - - - | F3 - - - E3 - - - | A2 - - - - - . .", harm:"C5 - B4 - A#4 - A4 - | G#4 - - - G4 - - - | E4 - - - - - . ." }
  };
  let jingleT=null;
  function jingle(name, next){
    clearTimeout(jingleT);
    const J=JINGLES[name]; if(!J) return;
    stopBgm(); cur=next||null;
    if(!on||!ac){ return; }
    const sd=60/J.bpm/2; let t0=ac.currentTime+0.05, steps=0;
    const lane=(str,wave,vol,o)=>{ const toks=str.replace(/\|/g," ").trim().split(/\s+/); steps=Math.max(steps,toks.length);
      toks.forEach((tk,i)=>{ const n=midi(tk); if(n==null) return; let len=1; while(toks[i+len]==="-") len++; voice(hz(n),t0+i*sd,sd*len*0.92,wave,vol,{vib:len>2,...o}); }); };
    lane(J.lead,"p25",0.34,{detune:7,cutoff:3400,fenv:2000,q:1.2,rev:0.3,dly:0.15,sus:0.8,r:0.14});
    lane(J.harm,"p12",0.18,{pan:-0.35,cutoff:2600,rev:0.35,sus:0.7,r:0.12});
    lane(J.bass,"triangle",0.5,{sub:true,cutoff:1300,sus:0.9,r:0.08});
    for(let i=0;i<steps;i+=4) kick(t0+i*sd);
    jingleT=setTimeout(()=>{ jingleT=null; if(next){ const n=next; cur=null; play(n); } }, (steps*sd+0.25)*1000);
  }
  function stopBgm(){ if(timer){ clearInterval(timer); timer=null; } }
  /* 効果音とジングル */
  const SFX = {
    ok:[["p50",84,.05]], cancel:[["p50",72,.05],["p50",67,.07]], hit:[["noise",.06],["p25",55,.05]],
    heal:[["p25",76,.05],["p25",81,.05],["p25",88,.09]], step:[["noise",.02]], buy:[["p25",79,.05],["p25",84,.09]],
    enc:[["p50",88,.04],["p50",76,.04],["p50",88,.04],["p50",76,.04],["p50",91,.12]],
    clap:[["noise",.03],[null,.03],["noise",.03],[null,.03],["noise",.05]], kira:[["p12",88,.05],["p12",91,.05],["p12",96,.05],["p12",100,.14]],
    win:[["p25",72,.1],["p25",76,.1],["p25",79,.1],["p25",84,.12],[null,.05],["p25",79,.08],["p25",84,.3]],
    lose:[["p25",67,.18],["p25",63,.18],["p25",60,.4]],
    slash:[["noise",.03],["p50",88,.02],["p50",76,.02],["noise",.07],["p50",48,.06]],
    skillhit:[["p12",84,.03],["p12",91,.03],["p12",96,.03],["noise",.08],["p50",52,.05],["p50",45,.08]],
    allhit:[["p25",72,.04],["p25",79,.04],["p25",84,.04],["noise",.06],["noise",.06],["noise",.1],["p50",40,.12]],
    meter:[["p25",60,.05],["p25",67,.05],["p25",72,.05],["p25",79,.05],["p25",84,.05],["p25",91,.08],["noise",.15],["p50",36,.25]],
    defeat:[["p50",79,.04],["p50",72,.04],["p50",67,.04],["noise",.12]], damage:[["noise",.09],["p50",45,.05],["p50",40,.08]], down:[["noise",.12],["p50",50,.08],["p50",43,.1],["p50",36,.22]], level:[["p25",79,.07],["p25",83,.07],["p25",86,.07],["p25",91,.25]],
    rank:[["p25",72,.12],["p25",79,.12],["p25",84,.12],["p25",88,.12],["p25",91,.4]]
  };
  function sfx(name){
    if(!on||!ac) return; let t=ac.currentTime+0.01;
    for(const s of (SFX[name]||[])){
      if(s[0]==="noise"){ noise(t,s[1]+0.03,0.5,1200,{type:"bandpass",q:0.5,out:sfxBus,rev:0.15}); noise(t,0.02,0.3,5000,{out:sfxBus}); t+=s[1]; }
      else if(s[0]===null){ t+=s[1]; }
      else { voice(hz(s[1]),t,s[2],s[0],0.42,{out:sfxBus,sus:0.8,detune:4,cutoff:4500,fenv:1500,rev:0.18,a:0.002,d:0.03,r:0.05}); t+=s[2]; }
    }
  }
  function setOn(v){
    if(v){ if(!init()){ on=false; return false; } if(ac.state==="suspended") ac.resume(); on=true; const c=cur; cur=null; if(c) play(c); }
    else { on=false; stopBgm(); }
    return on;
  }
  function suspend(){ stopBgm(); if(ac&&ac.state==="running") ac.suspend().catch(()=>{}); }
  function resume(){ if(on&&ac){ ac.resume().catch(()=>{}); const c=cur; cur=null; if(c) play(c); } }
  return { play, jingle, sfx, setOn, suspend, resume, get on(){return on;}, get current(){return cur;} };
})();

/* ===== platform: 保存（IndexedDB＋世代）と排他 ===== */
const DB = (()=>{
  let db=null;
  function open(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("toplivermichi-kyushu",1); r.onupgradeneeded=()=>r.result.createObjectStore("saves"); r.onsuccess=()=>{db=r.result;res(db);}; r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); }
  async function tx(mode, fn){ if(!db) await open(); return new Promise((res,rej)=>{ const t=db.transaction("saves",mode,{durability:"strict"}); const s=t.objectStore("saves"); let out; fn(s,v=>out=v); t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
  const get=k=>tx("readonly",(s,set)=>{ const r=s.get(k); r.onsuccess=()=>set(r.result); });
  const putPair=(cur,prev)=>tx("readwrite",s=>{ if(prev) s.put(prev,"auto-prev"); s.put(cur,"auto"); });
  return { get, putPair };
})();
function checksum(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0).toString(16); }

const G = { st:null, screen:"title", saveStatus:"未保存", readOnly:false, hasSave:false,
  walk:{path:[], prog:0, pending:null}, cv:null, vw:11, vh:9, scale:2, raf:0, lastTs:0, frame:0,
  cmd:{}, dlg:null, sheet:null, sheetData:{}, toast:null, newGame:{name:"",gender:null,composing:false,step:1},
  battleTimer:0, lastLog:[] };
let saveChain = Promise.resolve();
function commit(){
  const st=G.st; if(!st || G.readOnly) return Promise.resolve();
  if(!st.run) ensureVitals(st);
  st.saveGeneration++;
  const json=JSON.stringify(st); const rec={gen:st.saveGeneration, time:Date.now(), state:json, sum:checksum(json)};
  setSave("保存中…");
  saveChain = saveChain.then(async()=>{
    try{ const prev=await DB.get("auto"); await DB.putPair(rec, prev&&prev.gen<rec.gen?prev:null); setSave("保存済み"); return true; }
    catch(e){ try{ localStorage.setItem("tlr-kyushu-auto", JSON.stringify(rec)); setSave("保存済み（簡易保存）"); return true; }catch(e2){ setSave("未保存：この端末では保存できません。設定からバックアップを書き出してください。"); return false; } }
  });
  return saveChain;
}
async function loadSave(){
  const valid = r => r && r.state && checksum(r.state)===r.sum;
  let rec=null, prev=null;
  try{ rec=await DB.get("auto"); prev=await DB.get("auto-prev"); }catch(e){}
  if(!valid(rec)){ try{ const ls=JSON.parse(localStorage.getItem("tlr-kyushu-auto")||"null"); if(valid(ls)) rec=ls; }catch(e){} }
  if(valid(rec)) return {state:JSON.parse(rec.state), time:rec.time};
  if(valid(prev)) return {state:JSON.parse(prev.state), time:prev.time, fromPrev:true};
  return null;
}

}

function mountCanvas(){
  const wrap=$(".mapwrap"); const cv=$("#map"); G.cv=cv;

  const A = Math.min((wrap.clientWidth||358)-8, 448), H=(wrap.clientHeight||300)-8;
  G.scale = (Math.floor(A/32)>=7 && Math.floor(H/32)>=4) ? 2 : 1;
  G.vw=Math.max(5,Math.min(14,Math.floor(A/(16*G.scale))));
  G.vh=Math.max(3,Math.min(14,Math.floor(H/(16*G.scale))));
  cv.width=G.vw*16; cv.height=G.vh*16; cv.style.width=(G.vw*16*G.scale)+"px"; cv.style.height=(G.vh*16*G.scale)+"px";
  cv.addEventListener("pointerup", onMapTap);
  drawMap(); startLoop();
}
function camera(){
  const st=G.st, m=MAPS[st.mapId]; const p=playerPixel();
  let cx=p.x+8-G.vw*8, cy=p.y+12-G.vh*8;
  cx=Math.max(0,Math.min(m.w*16-G.vw*16,cx)); cy=Math.max(0,Math.min(m.h*16-G.vh*16,cy));
  if(m.w*16<G.vw*16) cx=(m.w*16-G.vw*16)/2; if(m.h*16<G.vh*16) cy=(m.h*16-G.vh*16)/2;
  return {x:Math.round(cx),y:Math.round(cy)};
}
function playerPixel(){
  const st=G.st, w=G.walk; let x=st.pos.x*16, y=st.pos.y*16;
  if(w.path.length){ const n=w.path[0]; x+= (n.x-st.pos.x)*16*w.prog; y+=(n.y-st.pos.y)*16*w.prog; }
  return {x:Math.round(x), y:Math.round(y)};
}
function drawMap(){
  const cv=G.cv; if(!cv||!cv.isConnected) return; const g=cv.getContext("2d"); g.imageSmoothingEnabled=false;
  const st=G.st, m=MAPS[st.mapId]; const cam=camera(); const now=performance.now();
  const still=st.settings.reduceMotion; const f=still?0:Math.floor(now/320)%4, f2=still?0:Math.floor(now/600)%2;
  g.fillStyle=PAL.ink; g.fillRect(0,0,cv.width,cv.height);
  const layer=ART.mapLayer(st.mapId,f);
  const sx=Math.max(0,cam.x), sy=Math.max(0,cam.y), w=Math.min(cv.width,layer.width-sx), h=Math.min(cv.height,layer.height-sy);
  g.drawImage(layer,sx,sy,w,h,sx-cam.x,sy-cam.y,w,h);
  const sprites=[];
  for(const o of m.objects){
    let img;
    if(o.type==="npc"){ const n=NPCS[o.npc]; img = o.npc==="moe"? charSprite("moe",0,f2*2) : ART.person(o.npc,n.sprite[1],n.sprite[0],0,f2*2,{long:["akari","chiyo","misuzu"].includes(o.npc)}); }
    else if(o.type==="shop"){ const n=NPCS[o.npc]; sprites.push({y:o.y-0.1,img:ART.object("shop",0),x:o.x}); img=ART.person(o.npc,n.sprite[1],n.sprite[0],0,f2*2); }
    else if(o.type==="inn"){ sprites.push({y:o.y-0.1,img:ART.object("inn",f),x:o.x}); img=ART.person("innkeeper",PAL.slate,PAL.navy,0,f2*2); }
    else if(o.type==="box") img=ART.object(st.boxes[o.box]?"boxOpen":"box",f);
    else if(o.type==="boss"){ if(st.bossDefeated[o.boss]) continue; img=ART.object("boss",f); }
    else img=ART.object(o.type,f);
    sprites.push({y:o.y,x:o.x,img});
  }
  const moving=G.walk.path.length>0; const wf=moving?Math.floor(now/166)%4:0;
  const pp=playerPixel();
  // 2人目の追従表示（表示のみ。判定は先頭だけ）
  const fol=G.fol; const lead=st.party[0], second=st.party[1];
  if(second && fol && (fol.x!==st.pos.x||fol.y!==st.pos.y||moving)){
    let fx=fol.x*16, fy=fol.y*16; let tx=fol.x, ty=fol.y;
    if(moving){ tx=st.pos.x; ty=st.pos.y; fx+=(tx-fol.x)*16*G.walk.prog; fy+=(ty-fol.y)*16*G.walk.prog; }
    const dx=(moving?tx:st.pos.x)-fol.x, dy=(moving?ty:st.pos.y)-fol.y; const fd = dy>0?0:dy<0?1:dx<0?2:dx>0?3:st.dir;
    sprites.push({y:fy/16, px:{x:Math.round(fx),y:Math.round(fy)}, img:charSprite(second,fd,moving?(wf+2)%4:0)});
  }
  sprites.push({y:pp.y/16+0.01, px:pp, img:charSprite(lead,st.dir,wf)});
  sprites.sort((a,b)=>a.y-b.y);
  for(const s of sprites){ const x=s.px?s.px.x:s.x*16, y=s.px?s.px.y:s.y*16; g.drawImage(s.img,x-cam.x,y-8-cam.y); }
  if(moving){ const d=G.walk.path[G.walk.path.length-1]; const bl=Math.floor(now/250)%2; g.strokeStyle=bl?PAL.cream:PAL.gold; g.strokeRect(d.x*16-cam.x+3.5,d.y*16-cam.y+3.5,9,9); }
}
function startLoop(){
  cancelAnimationFrame(G.raf); G.lastTs=0;
  const STEP=160;
  const loop=ts=>{
    if(G.screen!=="explore"||document.hidden){ G.raf=0; return; }
    const dt = G.lastTs? Math.min(100, ts-G.lastTs) : 16; G.lastTs=ts; G.frame++;
    const w=G.walk;
    if(w.path.length && !G.dlg && !G.sheet && !G.lock){
      const n=w.path[0]; const dx=n.x-G.st.pos.x, dy=n.y-G.st.pos.y; G.st.dir = dy>0?0:dy<0?1:dx<0?2:3;
      w.prog+=dt/STEP;
      if(w.prog>=1){ w.prog=0; w.path.shift(); G.fol={...G.st.pos}; G.st.pos={x:n.x,y:n.y}; arrive(); }
    }
    drawMap();
    G.raf=requestAnimationFrame(loop);
  };
  G.raf=requestAnimationFrame(loop);
}
function bfs(m,sx,sy,goal){
  const key=(x,y)=>y*m.w+x; const prev=new Map(); const q=[[sx,sy]]; prev.set(key(sx,sy),null);
  while(q.length){ const [x,y]=q.shift(); if(goal(x,y)&&!(x===sx&&y===sy)){ const path=[]; let k=key(x,y); while(k!==key(sx,sy)){ path.unshift({x:k%m.w,y:Math.floor(k/m.w)}); k=prev.get(k);} return path; }
    for(const [dx,dy] of [[0,1],[0,-1],[-1,0],[1,0]]){ const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=m.w||ny>=m.h) continue; const k=key(nx,ny); if(prev.has(k)) continue; if(!walkable(m,nx,ny)) continue; prev.set(k,key(x,y)); q.push([nx,ny]); } }
  return null;
}
function walkTo(x,y,pending){
  const st=G.st, m=MAPS[st.mapId]; if(G.readOnly) return toast("閲覧のみのタブです。");
  let path;
  const obj=objAt(m,x,y);
  if(obj && !obj.walk){ if(Math.abs(obj.x-st.pos.x)+Math.abs(obj.y-st.pos.y)===1 || (Math.max(Math.abs(obj.x-st.pos.x),Math.abs(obj.y-st.pos.y))<=1)){ interact(obj); return; }
    path=bfs(m,st.pos.x,st.pos.y,(px,py)=>Math.abs(px-x)+Math.abs(py-y)===1); pending=obj; }
  else { if(x===st.pos.x&&y===st.pos.y) return; if(!walkable(m,x,y)) return; path=bfs(m,st.pos.x,st.pos.y,(px,py)=>px===x&&py===y); }
  if(!path) return toast("そこへは行けません。");
  G.walk.path=path; G.walk.prog=0; G.walk.pending=pending||(obj&&obj.walk?obj:null);
}
function onMapTap(e){
  if(G.sheet||G.dlg) return; const r=G.cv.getBoundingClientRect(); const cam=camera();
  const lx=(e.clientX-r.left)*(G.cv.width/r.width)+cam.x, ly=(e.clientY-r.top)*(G.cv.height/r.height)+cam.y;
  walkTo(Math.floor(lx/16), Math.floor((ly+4)/16));
}
function arrive(){
  const st=G.st, m=MAPS[st.mapId]; const zone=zoneAt(m,st.pos.x,st.pos.y);
  if(SND.current!==(zone?"field":"fukuoka")) exploreBgm();
  if(zone){
    // 第07A・23G節：危険タイル到着ごとに1/24の独立抽選（戦えるメンバーがいない時は抽選しない）
    const canFight = st.party.some(c=>vitalOf(c).hp>0);
    if(canFight && randInt(24)===0){
      const rolls={count:randInt(2), picks:[randInt(10000),randInt(10000)]};
      G.walk.path=[]; G.walk.pending=null;
      startBattle(createFieldRun(st,zone,rolls)); return;
    }
    commit();
  }
  else keepFlush();
  const o=objAt(m,st.pos.x,st.pos.y);
  if(!G.walk.path.length){
    const pend=G.walk.pending; G.walk.pending=null;
    if(o&&o.walk) interact(o); else if(pend) interact(pend);
    commit(); refreshHere();
  } else if(o&&o.walk&&(o.type==="door")){ G.walk.path=[]; interact(o); }
  else if(!zone) refreshHere();
}
function exploreBgm(){ const st=G.st; if(!st) return SND.play("title"); const m=MAPS[st.mapId]; SND.play(zoneAt(m,st.pos.x,st.pos.y)?"field":"fukuoka"); }

function interact(o){
  const st=G.st; G.walk.path=[];
  const face=()=>{ const dx=o.x-st.pos.x, dy=o.y-st.pos.y; if(dx||dy) st.dir = Math.abs(dy)>=Math.abs(dx)?(dy>0?0:1):(dx<0?2:3); };
  face();
  switch(o.type){
    case "npc": return talkNpc(o.npc);
    case "shop": return openSheet("shop",{shop:o.shop, npc:o.npc, tab:"buy"});
    case "door": return travelMap(o.to,o.tx,o.ty);
    case "gate": return nationalRouteAvailable(st,curHub(),o.to)?openSheet("travel",{to:o.to,tx:o.tx,ty:o.ty}):say([["",o.to==="KY03"?"唐津への道は福岡編の完了後に開きます。":"この先の道はまだ開いていません。"]]);
    case "box": return openBox(o);
    case "sign": { const a=AREAS[o.area]; const b=Object.values(BOSSES).find(x=>x.areaId===o.area);
      return say([["案内板",`${a.name}（${o.area}）。強度q${a.q}・推奨レベル${a.q}。`+(b?`この奥に地域ボス「${b.name}」（推奨レベル${b.q}）。`:"")],["案内板",a.lore]]); }
    case "boss": return bossPrompt(o.boss);
    case "rest": return openSheet("rest");
    case "inn": return openSheet("inn",{label:o.label});
    case "board": return openSheet("party");
    case "shelf": return openSheet("record");
    case "bench": return say([["もえ",st.moeRank>=1?"ここから見る夕焼け、配信の最後に話したくなるね。":"夕焼けがきれい。……旅に出る前に、この景色を覚えておきたいな。"],[st.profile.name,"また帰ってこよう。"]]);
    case "tower": return say([["","放送塔が空へ伸びている。"]]);
    case "landmark": return say([["案内板","唐津の海辺。新しい土地の声を聞く旅が、ここから始まる。"],["もえ","街の人に、どんな景色を届けたいか聞いてみよう。"]]);
  }
}
function talkNpc(id){
  const st=G.st, n=NPCS[id], p=st.profile.name;

  if(!st.talked[id]){ lines=n.first(p); st.talked[id]=true; unlockSide(st);
    if(n.rep) lines.push(["",`${n.name}と話した。応援者帳に記録された（親密度1）。`]); }

function partyCard(m,i,run){

function buildAct(a){

      <div class="rmh"><b>${esc(charName(st,x.cid))}</b><span class="small">${esc(JOBS[s.job].name)}</span>${j.R1>j.R0?`<span class="rbadge">熟練度 ${j.R0}→${j.R1}</span>`:""}</div>
      <div class="gauge"><span>熟練度${R}</span><span class="bar jp"><i style="width:${pct(jp-jpA,jpB-jpA)}%"></i></span><b>＋${j.gain}</b></div>
      <div class="gauge"><span>体力</span><span class="bar"><i style="width:${pct(v.hp,s.maxHP)}%"></i></span><b>${v.hp}/${s.maxHP}</b></div>
      <div class="gauge"><span>集中力</span><span class="bar cp"><i style="width:${pct(v.c,s.startC)}%"></i></span><b>${v.c}/${s.startC}</b></div>
      ${up&&x.maxAfter>x.maxBefore?`<p class="small good">最大体力 ${x.maxBefore} → ${x.maxAfter}</p>`:""}
      ${down?`<p class="small warn">戦闘不能。宿屋か蘇生の道具で回復しよう。</p>`:low?`<p class="small warn">体力わずか。回復しておこう。</p>`:""}
    </div>`; }).join("");
  const items=[...(r.items||[]).map(x=>`<li class="ritem"><span class="rst">${"★".repeat(ITEMS[x.id].stars)}</span>${esc(ITEMS[x.id].name)} ×${x.n}<span class="small">（${esc(x.why)}）</span></li>`),
    ...(r.itemsVaulted||[]).map(x=>`<li class="ritem">${esc(ITEMS[x.id].name)} ×${x.n} はアイテム金庫へ</li>`),
    ...(r.itemsKept||[]).map(x=>`<li class="warn">${esc(ITEMS[x.id].name)} ×${x.n} は袋がいっぱいのため宿屋の預かり所へ</li>`),
    ...(r.itemsLost||[]).map(x=>`<li class="warn">${esc(ITEMS[x.id].name)} ×${x.n} は金庫と預かり所もいっぱいで受け取れず</li>`)];
  const gifts=r.gifts.map(g=>`<li class="ritem">専用品「${esc(EQUIP[g].name)}」を贈られた</li>`);
  const usedItems=(r.itemsUsed||[]).map(x=>{
    const effects=[x.hp>0?`体力＋${x.hp}`:"",x.c>0?`集中力＋${x.c}`:"",x.revives>0?`復帰${x.revives}人`:""].filter(Boolean);
    const actor=x.actor==="hero"||CHARS[x.actor]?`${esc(charName(st,x.actor))}：`:"";
    return `<li>${Number.isInteger(x.turn)&&x.turn>0?`${x.turn}ターン目・`:""}${actor}${esc(ITEMS[x.id]?.name||x.id)}${effects.length?`（${effects.join("・")}）`:""}</li>`;
  });
  const anyLow=st.roster.some(c=>{const v=vitalOf(c),s=charStats(st,c,L); return v.hp<=0||isLow(v.hp,s.maxHP);});
  return `<section class="result" aria-labelledby="rtitle">
    <div class="rbanner ${r.kind==="boss"?"boss":""}"><h2 id="rtitle">${title}</h2><p>${sub}</p></div>
    ${up?`<div class="rlevel"><b>レベルアップ！</b><span>レベル${r.levelBefore} → <b class="big">${r.levelAfter}</b></span>${Vof(r.levelAfter)>Vof(r.levelBefore)?`<span class="small">技能・装備・道具の効果量が上昇</span>`:""}</div>`:""}
    <div class="rgrid">${card("経験値",`＋${r.xp.toLocaleString()}`)}${card("ゴールド",`＋${r.gold.toLocaleString()}`,"gold")}${r.tickets?card("チケット",`＋${r.tickets.toLocaleString()}`):card("所持金",`${st.gold.toLocaleString()}G`)}</div>
    <div class="gauge rxp"><span>レベル${L}</span><span class="bar xp"><i style="width:${pct(xpNow,xpSpan)}%"></i></span><b>${L<999?`次まで${(xpSpan-xpNow).toLocaleString()}`:"最大"}</b></div>
    ${r.quest?`<div class="rquest done">依頼「${r.quest} ${esc(QUESTS[r.quest].name)}」完了！</div>`:r.kills&&r.killQuest?`<div class="rquest"><span>依頼 ${r.killQuest} 討伐</span><span class="bar"><i style="width:${pct(r.killNow,r.killNeed)}%"></i></span><b>${r.killNow}/${r.killNeed}</b></div>`:""}
    ${items.length||gifts.length?`<div class="rbox"><h3 class="label">手に入れたもの</h3><ul class="rlist">${[...items,...gifts].join("")}</ul></div>`:""}
    ${renderUsedItemHistory(r,usedItems)}
    ${(r.newBadges||[]).length?`<div class="rbox"><h3 class="label">新しい戦闘バッジ</h3><ul class="rlist">${r.newBadges.map(id=>`<li>${id} ${esc(ITEM_BADGES[id]||GROWTH_BADGES[id]||PARTY_BADGES[id]||ACTION_BADGES[id]||HEAL_BADGES[id]||MP_BADGES[id]||CHEER_BADGES[id]||SPEED_BADGES[id]||ATTACK_BADGES[id]||GUARD_BADGES[id]||DEFENSE_BADGES[id]||id)}</li>`).join("")}</ul></div>`:""}
    <button class="btn" data-a="openSheet" data-k="record">戦闘バッジ一覧を見る</button>
    ${r.notes.filter(n=>!/効果量が上昇/.test(n)).map(n=>`<p class="good rnote">${esc(n)}</p>`).join("")}
    <h3 class="label">仲間</h3><div class="rmems">${mem}</div>
    ${anyLow?`<p class="small warn">体力が減っている仲間がいます。次の戦闘へ持ち越すので、道具や宿屋で回復しておこう。</p>`:""}
    <div class="rfoot"><button class="btn primary wide" data-a="resultDone">探索へ</button></div></section>`;
}
function renderUsedItemHistory(result,usedItems){
  if(usedItems.length) return `<div class="rbox"><h3 class="label">この戦闘で使った道具（${usedItems.length}回）</h3><ul class="rlist">${usedItems.join("")}</ul>${result.itemsUsedKnown===true?"":`<p class="small">旧記録のため、使用履歴が一部欠けている可能性があります。</p>`}</div>`;
  return `<div class="rbox"><h3 class="label">この戦闘で使った道具</h3><p class="small">${result.itemsUsedKnown===true?"道具は使いませんでした。":"使用記録がありません（旧保存または履歴が不完全な戦闘）。"}</p></div>`;
}
function resultDone(){
  const r=G.st.lastResult; G.screen="explore"; keepFlush(); render(); exploreBgm();
  if(r && r.quest==="M01" && !G.st.scenes.RANK_D1) playScene("RANK_D1");
  else if(r && r.quest==="S01" && !G.st.scenes.S01_DONE) playScene("S01_DONE");
  else if(r && r.quest==="S02" && !G.st.scenes.S02_DONE) playScene("S02_DONE");
  else if(r && r.bossId==="B01" && !G.st.scenes.M02_BOSS) playScene("M02_BOSS");
  else if(r && r.bossId==="B02" && !G.st.scenes.M03_BOSS) playScene("M03_BOSS");
  else if(r && r.bossId==="B03" && !G.st.scenes.M04_BOSS) playScene("M04_BOSS");
}

/* ---- 配信（第13・14節） ---- */
function renderStream(){
  const st=G.st, s=st.stream; if(!s) return "";
  const req=s.requestIds;
  const theme=STREAM_THEMES[s.theme];
  if(s.done){
    const pass=s.score>=80;
    return statusBar()+`<section class="win stream">
      <h2 class="label">22時00分　締め</h2><p class="big">${s.score}点・${esc(streamGrade(s.score))}</p>
      <div class="meter"><i style="width:${Math.min(100,s.score/170*100)}%"></i><span class="line" style="left:${80/170*100}%"></span></div>
      <p>${pass?"目標80点を達成！":"80点に届かなかった。要望に合う行動を、まだ使っていない順に選ぶと点が伸びます。"}</p>
      <div class="stack">${pass?`<button class="btn primary" data-a="streamFinish">配信を終える</button>`:`<button class="btn primary" data-a="streamRetry">同じ配信に再挑戦（0枠）</button><button class="btn" data-a="streamLeave">いったん終える（配信待ちを保持）</button>`}</div></section>`;
  }
  const comments = [`初見です！ ${STREAM_ACTS[req[s.hand]].req}`, "こんばんは〜", s.hand>0?`${STREAM_ACTS[s.picks[s.hand-1].act].name}よかった！`:s.hub==="KY04"?"佐賀市から見てます":s.prefId==="PR02"?"唐津から見てます":"港から見てます"];
  return statusBar()+`<section class="win stream">
    <div class="srow"><span class="label">${s.hub==="KY04"?"佐賀市の声便":s.prefId==="PR02"?"唐津の声便":"九州エール便"}</span><span>${STREAM_TIMES[s.hand]}（${s.hand+1}／4手番）</span></div>
    <p class="small">メインライバー：もえ　配信サポート：${esc(charName(st,s.host))}　テーマ：${esc(theme.name)}　${s.style==="voice"?"声中心":"映像あり"}</p>
    <div class="meter" aria-label="得点${s.score}"><i style="width:${Math.min(100,s.score/170*100)}%"></i><span class="line" style="left:${80/170*100}%"></span></div>
    <div class="srow small"><span>得点 ${s.score}</span><span>目標 80</span></div>
    <div class="comments">${comments.map(c=>`<div class="cmt">${esc(c)}</div>`).join("")}</div>
    <p class="req">要望：「${esc(STREAM_ACTS[req[s.hand]].req)}」</p>
    <div class="stack">${Object.entries(STREAM_ACTS).map(([k,v])=>{ const used=s.used.includes(k); const pts = used?0:20+(req[s.hand]===k?20:0)+(!s.themeBonusUsed&&theme.act===k?10:0);
      return `<button class="btn opt" data-a="streamAct" data-v="${k}">${esc(v.name)}${used?"（使用済み・0点）":`（＋${pts}点）`}</button>`; }).join("")}</div>
  </section>`;
}
function streamAct(k){
  const st=G.st, s=st.stream; const r=streamPlay(s,k);
  const lines=s.hub==="KY04"?{first:"はじめまして。今日は佐賀市から配信しています。",local:"川沿いの道と駅前を歩き、街灯の広場まで来ました。",reply:"質問ありがとう。佐賀市の好きな景色も教えてください。",thanks:"街で聞いた声を、これからも大切にします。ありがとう。",like:"いいねの光が、街灯と並んで見えるよ。",kira:"キラコメが広場に届いたみたい。ありがとう。"}:s.prefId==="PR02"?{first:"はじめまして。今日は唐津の海辺から配信しています。",local:"海辺の小径と見晴らし台を歩いてきました。潮風が心地いいです。",reply:"質問ありがとう。皆さんが見たい景色も教えてください。",thanks:"唐津から届いた返事、ひとつずつ覚えておきます。ありがとう。",like:"いいねの光、海辺まで届いてるよ。",kira:"キラコメが波に映るみたい。ありがとう。"}:{first:"はじめましての人も、ゆっくりしていってね。今日は港の話をするよ。",local:"北九州の港は、夜になると灯りが波に映ってきれいなんです。",reply:"質問ありがとう！ 好きな場所は……灯台の段丘かな。",thanks:"今日来てくれた人、本当にありがとう。全部の声、覚えておくね。",like:"いいねの光、順番に灯っていくね！",kira:"キラコメ、届いてる！ 光の文字がきれい。"};
  SND.sfx(r.total?"ok":"cancel");
  if(s.done){ s.best=Math.max(st.streamBest[s.prefId]||0,s.score); st.streamBest[s.prefId]=s.best; }
  commit(); say([["もえ",lines[k]],["",`${STREAM_ACTS[k].name}：初使用${r.gain.first}＋要望一致${r.gain.match}＋テーマ${r.gain.theme}＝${r.total}点`]]);
}
function streamFinish(){
  const st=G.st; const qid=streamPending();
  if(!st||G.readOnly||G.screen!=="stream"||!st.stream?.done||st.stream.score<80||!qid||st.quests[qid]!=="combatDone"||QUESTS[qid].hub!==st.stream.hub) return toast("配信の状態が変わりました。依頼帳を確認してください。");
  st.stream=null;
  const res={xp:0,tickets:0}; completeQuest(st,qid,res);
  commit(); G.screen="explore"; exploreBgm(); render();
  toast(`${qid}完了：経験値＋${res.xp}・チケット＋${res.tickets}`);
  if(qid==="M02") playScene("RANK_D2");
  if(qid==="M03") playScene("RANK_D3");
  if(qid==="M04") playScene("RANK_C1");
}

/* ---- シート（メニュー） ---- */
function openSheet(k,data={}){ if(G.vaultSaving||G.shopSaving) return; G.sheet=k; G.sheetData=data; G.walk.path=[]; render(); const el=$(".sheet"); if(el) el.scrollTop=0; }
function closeSheet(){ if(G.vaultSaving||G.shopSaving) return; G.sheet=null; render(); }
function sheetWrap(title, body){ return `<div class="overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="win sheet"><div class="sheet-head"><h2 class="label">${esc(title)}</h2><button class="btn" data-a="closeSheet" ${G.vaultSaving||G.shopSaving?"disabled":""}>戻る</button></div>${body}</div></div>`; }

function worldTravelStatus(st,from,to,safe){

  if(!st.visitedHubs.includes(to)&&to==="KY04") return {available:false,reason:"初回は唐津の東門から向かってください。"};

function itemPurchaseRoom(st,id){ return bagRoom(st.bag,id)+Math.max(0,ITEM_VAULT_MAX-itemVaultCount(st)); }
function shopOffer(st,d){
  if(!SHOPS[d.shop]||!["buy","item","sell"].includes(d.tab)||!Number.isSafeInteger(d.qty)||d.qty<1) return null;
  const id=d.item, item=Object.hasOwn(ITEMS,id), equip=Object.hasOwn(EQUIP,id);
  if(!item&&!equip) return null;
  if(d.tab==="item"&&!item||d.tab==="buy"&&!equip) return null;
  if(d.tab==="item"&&!SHOP_ITEMS.includes(id)) return null;
  if(d.tab==="buy"){
    const gifts=[...JOB_IDS.filter(j=>st.gifts.W[j]).map(j=>"JW"+j.slice(1)),...JOB_IDS.filter(j=>st.gifts.A[j]).map(j=>"JA"+j.slice(1))];
    if(!SHOPS[d.shop].items.includes(id)&&!gifts.includes(id)) return null;
  }
  const own=item?bagCount(st.bag,id):(st.owned[id]||0);
  const max=d.tab==="item"?itemPurchaseRoom(st,id):d.tab==="buy"?8-own:item?own:availableCount(st,id);
  const unit=d.tab==="sell"?(item?ITEMS[id].sell:Math.floor(EQUIP[id].price/2)):(item?ITEMS[id].price:EQUIP[id].price);
  return {shop:d.shop,tab:d.tab,item:id,qty:d.qty,unit,own,max,gold:st.gold};
}

function drawMiniSprites(){

  document.querySelectorAll("canvas[data-dex]").forEach(c=>{ const [a,i]=c.dataset.dex.split("|"); const e=enemyDef(a,+i); const g=c.getContext("2d"); g.imageSmoothingEnabled=false; g.drawImage(ART.enemy(e.profile,e.species,e.attr,a,0),0,0); });
}
function validateState(s){
  const okNum=v=>Number.isFinite(v)&&v>=0;
  if(!okNum(s.xp)||!okNum(s.gold)||!okNum(s.tickets)||!MAPS[s.mapId]||!Array.isArray(s.roster)||!Array.isArray(s.party)||s.party.length<1||s.party.length>4||new Set(s.party).size!==s.party.length||s.party.some(c=>!CHARS[c]||!s.roster.includes(c))) throw new Error("bad");
  if(s.vaultGold!==undefined&&(!Number.isSafeInteger(s.vaultGold)||s.vaultGold<0)) throw new Error("bad vault");
  if(s.itemVault!==undefined&&(!Array.isArray(s.itemVault)||s.itemVault.some(e=>!ITEMS[e.id]||!Number.isSafeInteger(e.n)||e.n<1)||itemVaultCount(s)>ITEM_VAULT_MAX||new Set(s.itemVault.map(e=>e.id)).size!==s.itemVault.length)) throw new Error("bad item vault");
  for(const c of s.party) if(!JOBS[s.jobs[c]]) throw new Error("bad job");
}

function soundIsOn(){ if(G.soundWant!=null) return G.soundWant; if(G.st&&G.st.settings) return G.st.settings.sound!==false; return soundPref(); }
function soundPref(){ try{ return localStorage.getItem("tlr-kyushu-sound")!=="0"; }catch(e){ return true; } }
function migrate(s){

  if(s.run&&!s.run.bag) s.run.bag=clone(s.bag);

    if(!Array.isArray(s.run.itemHistory)){ s.run.itemHistory=[]; s.run.itemHistoryComplete=false; }
    else if(s.run.itemHistoryComplete!==true) s.run.itemHistoryComplete=false;
    if(s.run.actionHistoryComplete!==true || !s.run.actionFlags) s.run.actionHistoryComplete=false;
  }
  if(s.lastResult){
    if(!Array.isArray(s.lastResult.itemsUsed)) s.lastResult.itemsUsed=[];
    if(s.lastResult.itemsUsedKnown!==true) s.lastResult.itemsUsedKnown=false;
  }
  if(!Array.isArray(s.battleBadges)) s.battleBadges=[];
  if(s.settings&&s.settings.soundV!==2){ s.settings.sound=true; s.settings.soundV=2; }
  if(s.vitals===undefined) s.vitals=null;
  s.jobs.moe=s.jobs.moe||"J08"; s.jp.moe=s.jp.moe||{}; s.equip.moe=s.equip.moe||{w:null,a:null,acc:null};
  s.settings=Object.assign({difficulty:"std",sound:soundPref(),reduceMotion:false},s.settings||{});
  s.scenes=s.scenes||{}; s.cards=s.cards||[];
  if(!s.quests.M03) s.quests.M03=s.quests.M02==="complete"||s.fukuokaClear?"available":"locked";
  if(!s.quests.M04) s.quests.M04=s.quests.M03==="complete"?"available":"locked";
  return s;
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]"); if(!el||el.disabled) return;
  if(el.getAttribute("aria-disabled")==="true") return;
  const f=ACT[el.dataset.a]; if(!f) return;
  if(G.readOnly && !["openSheet","closeSheet","dlgNext","dlgBack","dlgSkip","toTitle","dexNav","partyView","shopTab","shopItem","vaultOpen","vaultBack"].includes(el.dataset.a)) return toast("別のタブで遊んでいるため、このタブは閲覧のみです。");
  f(el);
  if(el.dataset.a==="openSheet") drawMiniSprites();
});
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ G.walk.path=G.walk.path.slice(0,1); SND.suspend(); } else { SND.resume(); if(G.screen==="explore") startLoop(); } });
window.addEventListener("resize",()=>{ if(G.screen==="explore"){ G.walk.path=[]; clearTimeout(G.rsz); G.rsz=setTimeout(()=>{ if(G.screen==="explore") mountCanvas(); },120); } });

async function boot(){
  acquireLock(); PAD.mount(); SND.play("title");
  try{ const s=await loadSave(); G.hasSave=!!s; }catch(e){}
  const hot=window.claude&&window.claude.hot;
  if(hot&&hot.snapshot) hot.snapshot(()=>({st:G.st, screen:G.screen}));
  const data = hot&&hot.data;
  if(data&&data.st){ G.st=data.st; G.screen=data.screen==="new"?"title":data.screen; G.hasSave=true; }
  render(); if(G.screen==="title") drawTitleArt();
}

/* ===== input: ジョイコントローラー（画面上のスティック＋決定/戻る、ゲームパッド、キーボード） ===== */
const PAD = (()=>{
  let dir=null, repeatT=0, lastMove=0;            // dir: 0下 1上 2左 3右
  const VEC=[[0,1],[0,-1],[-1,0],[1,0]];
  const isMoveMode=()=> G.screen==="explore" && !G.sheet && !G.dlg && G.st && !G.readOnly;

  /* ---- 画面上のスティック ---- */
  function mount(){
    const dock=document.getElementById("dock"); if(!dock || dock.dataset.ready) return; dock.dataset.ready="1";
    const base=dock.querySelector(".stick"), knob=dock.querySelector(".knob");
    let pid=null;
    const upd=e=>{
      const r=base.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, R=r.width*0.34;
      let dx=e.clientX-cx, dy=e.clientY-cy; const d=Math.hypot(dx,dy);
      if(d>R){ dx=dx/d*R; dy=dy/d*R; }
      knob.style.transform=`translate(${dx}px,${dy}px)`;
      const mag=Math.hypot(dx,dy)/R;
      setDir(mag<0.35?null: Math.abs(dx)>Math.abs(dy)? (dx<0?2:3) : (dy<0?1:0), "stick");
    };
    base.addEventListener("pointerdown",e=>{ pid=e.pointerId; base.setPointerCapture(pid); base.classList.add("on"); SND.sfx("step"); upd(e); e.preventDefault(); });
    base.addEventListener("pointermove",e=>{ if(e.pointerId===pid) upd(e); });
    const end=e=>{ if(e.pointerId!==pid) return; pid=null; base.classList.remove("on"); knob.style.transform=""; setDir(null,"stick"); };
    base.addEventListener("pointerup",end); base.addEventListener("pointercancel",end); base.addEventListener("lostpointercapture",end);
    dock.querySelector("[data-pad=a]").addEventListener("click",()=>pressA());
    dock.querySelector("[data-pad=b]").addEventListener("click",()=>pressB());
    requestAnimationFrame(tick);
  }
  const sources={};
  function setDir(d, src){
    sources[src]=d;
    const nd = ["key","gamepad","stick"].map(s=>sources[s]).find(x=>x!=null) ?? null;
    if(nd===dir) return;
    dir=nd; updateArrow();
    if(dir==null){ if(isMoveMode() && G.walk.path.length>1) G.walk.path=G.walk.path.slice(0,1); return; }
    if(!isMoveMode()){ moveCursor(dir); repeatT=performance.now()+380; }
  }
  function updateArrow(){ const a=document.querySelector("#dock .stick"); if(a) a.dataset.dir = dir==null?"":["下","上","左","右"][dir]; }

  /* 毎フレーム：移動の継続、カーソルの連続移動、ゲームパッドの読み取り */
  let prevBtn={};
  function tick(now){
    pollGamepad();
    if(dir!=null){
      if(isMoveMode()){
        if(!G.walk.path.length){
          const st=G.st, m=MAPS[st.mapId]; st.dir=dir; const nx=st.pos.x+VEC[dir][0], ny=st.pos.y+VEC[dir][1];
          if(walkable(m,nx,ny)){ G.walk.path=[{x:nx,y:ny}]; G.walk.prog=0; G.walk.pending=null; }
          else if(now-lastMove>400){ lastMove=now; const o=objAt(m,nx,ny); if(o){ refreshHere(); } }
        }
      } else if(now>repeatT){ moveCursor(dir); repeatT=now+170; }
    }
    requestAnimationFrame(tick);
  }

  /* ---- カーソル（▶）の移動：今見えている一番手前の画面の中だけで動く ---- */
  function scope(){ const d=document.querySelector(".dlg-ov"); if(d) return d; const s=document.querySelector(".overlay"); if(s) return s; return document.getElementById("screen"); }
  function focusables(sc){
    return [...sc.querySelectorAll("button,input,textarea,[data-a]")].filter(el=>{
      if(el.disabled||el.getAttribute("aria-disabled")==="true") return false;
      if(el.closest("[hidden]")) return false; const r=el.getBoundingClientRect(); return r.width>0&&r.height>0;
    });
  }
  function current(sc){ const k=sc.querySelector(".kfocus"); if(k) return k; const a=document.activeElement; return a&&sc.contains(a)&&a!==document.body?a:null; }
  function setCursor(el){
    document.querySelectorAll(".kfocus").forEach(x=>x.classList.remove("kfocus"));
    if(!el) return; el.classList.add("kfocus");
    try{ el.focus({preventScroll:true}); }catch(e){}
    el.scrollIntoView({block:"nearest",inline:"nearest"});
    G.cursorSig = sig(el);
  }
  function sig(el){ return [el.dataset.a,el.dataset.k,el.dataset.v,el.dataset.i,el.dataset.c,el.dataset.s,el.id].join("|"); }
  function moveCursor(d){
    const sc=scope(); if(!sc) return; const list=focusables(sc); if(!list.length) return;
    const cur=current(sc);
    if(!cur || !list.includes(cur)){
      const pref = sc.querySelector(".cmd") ? list.find(el=>el.closest(".cmd")) : sc.querySelector(".sheet") ? list.find(el=>el.closest(".sheet")&&el.dataset.a!=="closeSheet") : null;
      setCursor(pref||list[0]); SND.sfx("ok"); return; }
    const r=cur.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    let best=null, bs=Infinity;
    for(const el of list){ if(el===cur) continue; const q=el.getBoundingClientRect(), x=q.left+q.width/2, y=q.top+q.height/2;
      const dx=x-cx, dy=y-cy; let main, side;
      if(d===0){ main=dy; side=dx; } else if(d===1){ main=-dy; side=dx; } else if(d===2){ main=-dx; side=dy; } else { main=dx; side=dy; }
      if(main<=4) continue; const s=main+Math.abs(side)*2.2; if(s<bs){ bs=s; best=el; } }
    if(best){ setCursor(best); SND.sfx("step"); }
  }
  /* 再描画の後、同じボタンへカーソルを戻す */
  function restore(){
    if(!G.cursorSig || isMoveMode()) return;
    const sc=scope(); if(!sc) return; const el=focusables(sc).find(e=>sig(e)===G.cursorSig);
    if(el){ el.classList.add("kfocus"); try{ el.focus({preventScroll:true}); }catch(e){} } else G.cursorSig=null;
  }

  /* ---- 決定（A）と戻る（B） ---- */
  function pressA(){
    const sc=scope();
    if(isMoveMode()){ const near=nearbyObjects(); if(!near.length) return toast("近くに調べられるものはありません。"); if(near.length===1) return interact(near[0]); return openSheet("nearby"); }
    if(G.dlg){ const b=document.getElementById("dlgNext"); if(b) b.click(); return; }
    const cur=sc&&current(sc);
    if(cur && focusables(sc).includes(cur)){ cur.click(); return; }
    moveCursor(0);
  }
  function pressB(){
    if(G.dlg){ ACT.dlgSkip(); return; }
    if(G.sheet){ const back=document.querySelector(".overlay [data-a=closeSheet]"); if(back) back.click(); return; }
    if(G.screen==="battle"&&G.auto){ ACT.autoOff(); return; }
    if(G.screen==="battle"&&G.st&&G.st.run&&G.st.run.state==="input"){ G.cmd={actor:G.cmd.actor}; G.cursorSig=null; render(); SND.sfx("cancel"); return; }
    if(isMoveMode()){ G.walk.path=G.walk.path.slice(0,1); G.walk.pending=null; return; }
    SND.sfx("cancel");
  }

  /* ---- ゲームパッド（Joy-Con・Proコントローラー・一般のコントローラー） ---- */
  function pollGamepad(){
    let pads=[]; try{ pads=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[]; }catch(e){}
    if(!pads.length){ if(sources.gamepad!=null) setDir(null,"gamepad"); return; }
    const gp=pads[0]; const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
    let d=null;
    if(b(12)) d=1; else if(b(13)) d=0; else if(b(14)) d=2; else if(b(15)) d=3;
    else { const x=gp.axes[0]||0, y=gp.axes[1]||0; if(Math.hypot(x,y)>0.5) d = Math.abs(x)>Math.abs(y)?(x<0?2:3):(y<0?1:0); }
    setDir(d,"gamepad");
    // 任天堂系は右ボタン(標準1番)が決定、それ以外は下ボタン(標準0番)が決定
    const nin=/joy-?con|nintendo|pro controller|057e/i.test(gp.id||"");
    const aIdx=nin?1:0, bIdx=nin?0:1;
    const now={a:b(aIdx), b:b(bIdx), start:b(9)};
    if(now.a&&!prevBtn.a) pressA();
    if(now.b&&!prevBtn.b) pressB();
    if(now.start&&!prevBtn.start&&isMoveMode()) openSheet("status");
    prevBtn=now;
  }
  window.addEventListener("gamepadconnected",e=>toast(`コントローラーを接続しました（${(e.gamepad.id||"").slice(0,24)}）`));

  /* ---- キーボード（パソコンでの確認用） ---- */
  const KEYS={ArrowDown:0,ArrowUp:1,ArrowLeft:2,ArrowRight:3,s:0,w:1,a:2,d:3};
  document.addEventListener("keydown",e=>{
    const t=e.target; if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA")) return;
    if(KEYS[e.key]!=null){ e.preventDefault(); if(!e.repeat) setDir(KEYS[e.key],"key"); return; }
    if(e.key==="Enter"||e.key===" "||e.key==="z"){ e.preventDefault(); if(!e.repeat) pressA(); }
    if(e.key==="Escape"||e.key==="x"||e.key==="Backspace"){ e.preventDefault(); if(!e.repeat) pressB(); }
  });
  document.addEventListener("keyup",e=>{ if(KEYS[e.key]!=null && sources.key===KEYS[e.key]) setDir(null,"key"); });
  document.addEventListener("pointerdown",e=>{ if(!e.target.closest("#dock")){ document.querySelectorAll(".kfocus").forEach(x=>x.classList.remove("kfocus")); G.cursorSig=null; } },true);

  /* BGMは初期ON：ブラウザの制限で、最初に画面へ触れた時に鳴らし始める */
  function wantSound(){ if(G.soundWant!=null) return G.soundWant; if(G.st && G.st.settings && G.st.settings.sound===false) return false; return soundPref(); }
  const unlock=()=>{ if(SND.on) return; if(wantSound()){ SND.setOn(true); } };
  ["pointerdown","keydown","touchend"].forEach(ev=>document.addEventListener(ev,unlock,{capture:true,passive:true}));
  return { mount, restore, pressA, pressB };
})();

if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(()=>boot()); else boot();
</script>
