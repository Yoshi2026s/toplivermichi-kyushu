<meta name="theme-color" content="#101820">
<style>body{margin:0}</style>

</head><body>
<title>ポコチャクエスト</title>

<style>
/* 縦1列・幅上限480。濃紺の文字窓と生成りの二重枠（第21F・21K節）。単一の夜色テーマで統一 */
:root{
  --dockH:104px;
  --ink:#101820; --navy:#23364D; --slate:#455A68; --mist:#8B9BA0; --cream:#F4ECD8; --sand:#D4B483;
  --red:#B84B4B; --coral:#E88470; --gold:#D5B34C; --leaf:#5F7D4E; --sea:#4D8491; --aqua:#83B9AE; --violet:#6E608A;
  --f-dot:"DotGothic16","BIZ UDPGothic",system-ui,sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--cream)}
body{font-family:var(--f-body);font-size:18px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
#screen{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.label{font-family:var(--f-dot);font-weight:400;letter-spacing:.06em;color:var(--gold);font-size:18px}
h3.label{font-size:16px;margin-top:8px}
.small{font-size:15px;color:#D9D2C0}
.dim{color:var(--mist)}
.warn{color:var(--coral)}
.good{color:var(--aqua)}
.win{background:var(--navy);border:3px double var(--cream);border-radius:2px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{font:inherit;font-size:17px;min-height:48px;padding:8px 12px;background:var(--ink);color:var(--cream);border:2px solid var(--mist);border-radius:2px;cursor:pointer;text-align:left;touch-action:manipulation}
.btn:hover{border-color:var(--cream)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--red);border-color:var(--cream);font-weight:700}
.btn.on{border-color:var(--gold);background:#2E2A22}
.btn.sq{min-width:48px;text-align:center;padding:0}
.btn.wide{width:100%;text-align:center}
.stack{display:flex;flex-direction:column;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center}
.srow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.tag{font-size:14px;border:1px solid var(--mist);padding:0 6px;font-family:var(--f-dot)}
.tag.danger{border-color:var(--coral);color:var(--coral)}
.tag.safe{border-color:var(--aqua);color:var(--aqua)}
.status{background:var(--ink);border:3px double var(--mist);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.status .place{font-family:var(--f-dot);color:var(--gold)}
.goal{font-size:16px}
/* タイトル */
.title-screen{display:flex;flex-direction:column;gap:14px;align-items:stretch}
#titleArt{width:100%;max-width:480px;image-rendering:pixelated;border:3px double var(--cream)}
.logo{display:flex;flex-direction:column;font-family:var(--f-dot);font-weight:400;line-height:1.25}
.logo .main{font-size:clamp(24px,7.6vw,40px);white-space:nowrap;color:var(--cream);letter-spacing:.04em;text-shadow:3px 3px 0 var(--red)}
.logo .sub{font-size:24px;color:var(--gold);letter-spacing:.3em}
.lead{font-size:18px}
.menu{display:flex;flex-direction:column;gap:8px}
.note{font-size:15px;color:var(--mist)}
/* 主人公設定 */
.input{font:inherit;font-size:20px;min-height:48px;background:var(--ink);color:var(--cream);border:2px solid var(--mist);padding:6px 10px;width:100%;box-sizing:border-box}
.input.mono{font-family:ui-monospace,monospace;font-size:13px}
.field-label{font-size:16px;color:var(--sand)}
.gender{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gender legend{margin-bottom:6px}
.sprite-lg{width:96px;height:auto;image-rendering:pixelated;align-self:center;background:var(--leaf);border:2px solid var(--ink)}
.sprite-md{width:48px;height:72px;image-rendering:pixelated;background:var(--leaf);border:2px solid var(--ink);flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.kv dt{color:var(--sand);font-size:15px}
.kv dd{margin:0;min-width:0}
.list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:2px;font-size:16px}
/* 探索 */
/* 探索：1画面に収める。地図が残りの高さを使う */
body.in-explore{padding-top:6px;padding-bottom:calc(var(--dockH) + 6px + env(safe-area-inset-bottom,0px));margin:0}
.explore{display:flex;flex-direction:column;gap:6px;height:calc(100dvh - 12px - var(--dockH) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:hidden}
@supports not (height:100dvh){.explore{height:calc(100vh - 12px - var(--dockH))}}
.xhead{background:var(--ink);border:3px double var(--mist);padding:4px 8px;display:flex;flex-direction:column;gap:0;flex:none;font-size:15px;line-height:1.35}
.xhead .place{font-family:var(--f-dot);color:var(--gold)}
.xhead .goal{font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.xsave{font-size:12px;color:var(--mist)}
.mapwrap{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--ink);border:3px double var(--cream);padding:4px;overflow:hidden}
#map{image-rendering:pixelated;touch-action:manipulation;max-width:100%}
.here{font-size:14px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xact{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.xact .btn{min-height:44px;text-align:center;font-size:16px}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
.pad .btn.sq{min-width:44px;min-height:44px}
.menu-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex:none}
.menu-grid .btn{text-align:center;font-family:var(--f-dot);min-height:44px;padding:2px 0;font-size:clamp(12px,3.4vw,14px);letter-spacing:-.06em;white-space:nowrap;overflow:hidden}
/* 会話・シート */
.overlay{position:fixed;inset:0;background:rgba(16,24,32,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:480px;max-height:calc(100% - 24px);overflow-y:auto;box-sizing:border-box}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--navy);padding-block:4px;z-index:1}
.dlg{width:100%;max-width:480px;box-sizing:border-box}
.speaker{font-family:var(--f-dot);color:var(--gold)}
.dlg-text{font-size:19px;min-height:3.2em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);border:2px solid var(--gold);padding:8px 14px;z-index:40;max-width:90%;font-size:16px}
.qcard,.jcard{border:2px solid var(--slate);padding:10px;display:flex;flex-direction:column;gap:6px}
.qcard.complete{opacity:.7}
.jcard.on{border-color:var(--gold)}
.opts{display:flex;flex-direction:column;gap:6px}
.btn.opt{font-size:16px}
.dexrow{display:flex;flex-direction:column;gap:2px}
.who{display:flex;gap:12px;align-items:center}
.prow{display:flex;gap:6px}.grow{flex:1;min-width:0}
.qty{text-align:center;font-family:var(--f-dot)}
/* 戦闘：1画面に収める（縦スクロールなし）。上から 状態→敵→味方→コマンド→ログ */
body.in-battle{padding-top:6px;padding-bottom:calc(var(--dockH) + 6px + env(safe-area-inset-bottom,0px));margin:0}
.battle{display:flex;flex-direction:column;gap:6px;height:calc(100dvh - 12px - var(--dockH) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));font-size:15px;line-height:1.35;overflow:hidden}
@supports not (height:100dvh){.battle{height:calc(100vh - 12px - var(--dockH))}}
.bhead{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-dot);color:var(--gold);font-size:14px;flex-wrap:wrap}
.gauge{display:grid;grid-template-columns:auto 1fr 2.2em;gap:6px;align-items:center;font-size:14px}
.gauge b{text-align:right;font-variant-numeric:tabular-nums}
.battle-support{margin:0;color:var(--gold);font-size:12px}
.bar{display:block;height:7px;background:var(--ink);border:1px solid var(--mist);overflow:hidden}
.bar i{display:block;height:100%;background:var(--aqua)}
.bar.enemy i{background:var(--coral)}
.bar.ale{height:12px}.bar.ale i{background:var(--gold)}
.cue{border:1px dashed var(--mist);padding:2px 6px;font-size:13px;color:#D9D2C0}
.cue.on{border:2px solid var(--gold);color:var(--gold);font-size:14px}
.enemies{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px;flex:none}
.enemies{position:relative;padding:2px;overflow:hidden}
.stagebg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated;z-index:0}
.ecard{position:relative;z-index:1;background:rgba(16,24,32,.42);text-shadow:1px 1px 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink),2px 2px 0 var(--ink);border:2px solid var(--slate);padding:4px 6px;display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:center;min-width:0}
.einfo{display:contents}
.ecard .esprite{grid-row:1}.ecard .ename{grid-row:1;grid-column:2}
.ecard .bar,.ecard .estat,.ecard .tele{grid-column:1 / -1}
.ecard.isboss{grid-template-columns:auto 1fr}.ecard.isboss .esprite{grid-row:1 / span 4}.ecard.isboss .bar,.ecard.isboss .estat,.ecard.isboss .tele{grid-column:2}
.ecard.down{opacity:.4}
.esprite{width:40px;height:40px;image-rendering:pixelated}
.esprite.boss{width:clamp(72px,22vw,104px);height:auto;aspect-ratio:1}
.ename{font-size:15px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.rar{font-size:12px;color:var(--gold);font-weight:400}
.estat{font-size:13px;font-variant-numeric:tabular-nums}
.tele{font-size:14px;color:var(--coral);font-weight:700}
.hitfx{animation:hit .3s steps(3)}
@keyframes hit{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}100%{transform:none}}
.party{display:grid;grid-template-columns:1fr 1fr;gap:4px;flex:none}
.pcard{position:relative;font:inherit;color:var(--cream);background:var(--ink);border:2px solid var(--slate);padding:3px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:48px;cursor:pointer;min-width:0;line-height:1.25}
.pcard.on{border-color:var(--gold);background:#2E2A22}
.pcard.done{opacity:.6}.pcard.ko{opacity:.4}
.pline{display:flex;gap:0 4px;align-items:baseline;min-width:0;font-size:14px}
.pline b{min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pline .pst{flex:none;white-space:nowrap}
.pjob{font-size:12px;color:var(--sand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pst{font-size:12px;border:1px solid var(--mist);padding:0 3px;flex:none}
.pstat{font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:clip}
.pbadges{display:flex;gap:3px;flex-wrap:wrap}.pstat b{font-weight:700;color:var(--cream)}
.win.cmd{padding:6px;gap:6px;flex:1 1 auto;min-height:0;overflow:hidden;border-width:3px;display:flex;flex-direction:column}
.cmd .cmdgrid,.cmd .confirmrow{flex:none}
.cmd .cmdgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cmd .cmdgrid .btn{font-size:13px;min-height:44px;padding:2px 2px;text-align:center;line-height:1.15;letter-spacing:-.03em}
.chipbreak{flex-basis:100%;height:0}
.sw{display:none}
@media (max-width:340px){.lw{display:none}.sw{display:inline}}
.chips{display:flex;flex-wrap:wrap;gap:4px;flex:0 1 auto;min-height:0;overflow-y:auto;align-content:flex-start}
.chip{font:inherit;font-size:14px;min-height:40px;padding:2px 10px;background:var(--ink);color:var(--cream);border:2px solid var(--mist);border-radius:2px;cursor:pointer;max-width:100%;overflow-wrap:anywhere;text-align:left}
.chiplabel{align-self:center;font-size:12px;color:var(--sand);margin-left:4px}
.chip.on{border-color:var(--gold);background:#2E2A22}
.chip:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.confirmrow{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;margin-top:auto}
.confirmrow .btn{min-height:48px;min-width:88px;text-align:center}
.preview{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.3;min-width:0}
.preview .pinfo{color:#D9D2C0}.preview .pv{color:var(--aqua);font-size:14px}.preview .hint{color:var(--mist)}.preview .warn{font-size:14px}
.cmd p{font-size:15px}
.log{font:inherit;text-align:left;color:var(--cream);font-size:13px;line-height:1.3;background:var(--ink);border:2px solid var(--slate);padding:4px 6px;display:flex;flex-direction:column;gap:1px;flex:none;min-height:48px}
.log span{overflow-wrap:anywhere}
.log-entry{font:inherit;color:inherit;text-align:left;background:none;border:0;padding:0;overflow-wrap:anywhere;cursor:pointer}
.log-entry:focus-visible{outline:2px solid var(--gold)}
.battle:has(.log.expanded){overflow-y:auto}
.battle .log.expanded{min-height:232px;max-height:232px;overflow-y:auto}
@media (max-height:600px){.explore{height:auto;overflow:visible}.mapwrap{flex:none;height:200px}.battle{height:auto;overflow:visible}.win.cmd{overflow:visible}.chips{overflow:visible}}
@media (max-height:700px){.cue,.cue.on{font-size:12px}.bhead{font-size:12px}.pstat{font-size:12px}.pjob{display:none}.esprite.boss{width:60px}.bhead{font-size:13px}.ename{font-size:14px}.esprite{width:32px;height:32px}.pcard{min-height:44px}.cmd .cmdgrid .btn{min-height:40px}.chip{min-height:36px}.log span:first-child:nth-last-child(3){display:none}}
.pop{position:absolute;right:8px;top:2px;font-family:var(--f-dot);font-size:20px;font-weight:700;pointer-events:none;animation:popup .9s steps(6) forwards;text-shadow:2px 2px 0 var(--ink);z-index:3}
.pop.dmg{color:var(--cream)}.pop.hurt{color:var(--coral)}.pop.heal{color:var(--aqua)}
@keyframes popup{0%{transform:translateY(6px);opacity:1}70%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.shake{animation:shake .3s steps(3)}
@keyframes shake{0%{transform:translateX(-3px)}50%{transform:translateX(3px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}}
.pstrip{position:relative;font:inherit;color:var(--cream);background:var(--ink);border:2px solid var(--slate);padding:3px 8px;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;text-align:left;cursor:pointer;min-height:48px;flex:none}
.pstop{grid-column:1 / -1;display:flex;justify-content:space-between;gap:6px;font-size:12px;color:#D9D2C0}
.pstrip:hover{border-color:var(--cream)}
.pmini{display:flex;flex-direction:column;gap:1px;min-width:0;font-size:14px}
.pmline{display:flex;flex-direction:column;gap:0;min-width:0;line-height:1.3}
.pmline b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.pmline .small{white-space:nowrap;font-size:12px}
.pmini.ko{opacity:.5}
.pmini .small{font-size:13px;font-variant-numeric:tabular-nums}
.pmore{font-size:12px;color:var(--gold);font-family:var(--f-dot);flex:none}
.scard{border:2px solid var(--slate);padding:10px;display:flex;flex-direction:column;gap:8px}
.scard.ko{border-color:var(--red)}
.sname{font-size:18px}
.scard .kv dd{font-variant-numeric:tabular-nums}
.bar.wide{height:8px;margin-bottom:2px}
/* ジョイコントローラー（画面下に固定） */
body.no-dock{--dockH:0px}
body.no-dock .dock{display:none}
body{padding-bottom:calc(var(--dockH) + 12px)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--dockH);box-sizing:content-box;padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));background:var(--ink);border-top:3px double var(--mist);display:flex;align-items:center;justify-content:space-between;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.dock>*{max-width:480px}
.stick{position:relative;width:92px;height:92px;flex:none;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--slate) 0 38%,var(--navy) 39% 100%);border:3px solid var(--cream);box-shadow:inset 0 0 0 3px var(--ink);touch-action:none;cursor:pointer}
.stick .ring{position:absolute;inset:10px;border-radius:50%;border:2px dashed var(--mist);pointer-events:none}
.stick .knob{position:absolute;left:50%;top:50%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:var(--red);border:3px solid var(--cream);box-shadow:0 3px 0 var(--ink);pointer-events:none;transition:transform .08s steps(2)}
.stick.on .knob{background:var(--coral);transition:none}
.stick[data-dir]:not([data-dir=""])::after{content:attr(data-dir);position:absolute;right:-6px;top:-6px;font-family:var(--f-dot);font-size:12px;background:var(--gold);color:var(--ink);padding:0 4px}
.dock .hint{flex:1;min-width:0;font-size:12px;color:var(--mist);text-align:center;line-height:1.3}
.abtns{display:flex;align-items:center;gap:10px;flex:none}
.pbtn{font:inherit;width:58px;height:58px;border-radius:50%;border:3px solid var(--cream);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:pointer;box-shadow:0 3px 0 var(--ink);touch-action:manipulation}
.pbtn b{font-family:var(--f-dot);font-size:20px}.pbtn small{font-size:12px;margin-top:2px}
.pbtn.a{background:var(--red);width:66px;height:66px}
.pbtn.b{background:var(--slate);margin-top:18px}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.kfocus{outline:3px solid var(--gold)!important;outline-offset:2px;position:relative}
.btn.kfocus::before,.chip.kfocus::before{content:"▶";position:absolute;left:-2px;top:50%;transform:translate(-100%,-50%);color:var(--gold);font-size:12px}
.overlay{padding-bottom:calc(12px + var(--dockH) + env(safe-area-inset-bottom,0px))!important}
.toast{bottom:calc(16px + var(--dockH) + env(safe-area-inset-bottom,0px))!important}
@media (max-height:700px){
  :root{--dockH:76px}
  .stick{width:68px;height:68px}.stick .knob{width:32px;height:32px;margin:-16px 0 0 -16px}.stick .ring{inset:7px}
  .pbtn{width:46px;height:46px}.pbtn.a{width:54px;height:54px}.pbtn.b{margin-top:10px}.pbtn b{font-size:17px}.pbtn small{font-size:12px}
  .battle .log:not(.expanded){min-height:0}.battle .log:not(.expanded) .log-entry:not(:last-child){display:none}
  .cmd .cmdgrid .btn{min-height:36px}.chip{min-height:34px}.pcard{min-height:40px}.confirmrow .btn{min-height:44px}
  .battle{gap:4px}
  .battle .cue:not(.on){display:none}
  .chip{min-height:32px}.chips{gap:3px}
}

/* ===== 操作の配置：既定はスティック右・A/B左 ===== */
body:not(.stick-left) .dock{flex-direction:row-reverse}
body:not(.stick-left) .abtns{flex-direction:row-reverse}
body:not(.stick-left) .stick[data-dir]:not([data-dir=""])::after{right:auto;left:-6px}
.padside .btn{font-size:15px;text-align:center}
/* ===== 戦闘結果 ===== */
.result{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.rbanner{text-align:center;background:linear-gradient(180deg,#2E2A22,var(--navy));border:3px double var(--gold);padding:6px 8px}
.rbanner h2{margin:0;font-family:var(--f-dot);color:var(--gold);font-size:28px;line-height:1.3;letter-spacing:.12em;text-shadow:2px 2px 0 var(--ink)}
.rbanner.boss h2{color:var(--coral)}
.rbanner p{margin:2px 0 0;font-size:15px;color:var(--cream)}
.rlevel{background:#3A2E1A;border:2px solid var(--gold);padding:4px 10px;text-align:center;font-size:17px;display:flex;flex-direction:column;gap:0}
.rlevel b{font-family:var(--f-dot);color:var(--gold)}
body:not(.reduce-motion) .rlevel{animation:rpulse 1.2s steps(4) 2}
@keyframes rpulse{50%{box-shadow:0 0 0 4px rgba(213,179,76,.45)}}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rstat{background:var(--ink);border:2px solid var(--slate);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.rlab{font-size:13px;color:var(--sand)}
.rval{font-family:var(--f-dot);font-size:clamp(17px,5.4vw,22px);color:var(--cream);font-variant-numeric:tabular-nums;white-space:nowrap}
.rstat.gold .rval{color:var(--gold)}
.rxp{grid-template-columns:auto 1fr auto}
.bar.xp{height:10px}.bar.xp i{background:var(--gold)}
.bar.jp i{background:var(--violet)}
.bar.cp i{background:var(--sea)}
.rquest{display:grid;grid-template-columns:auto 1fr auto;gap:6px;align-items:center;background:var(--ink);border:2px solid var(--slate);padding:6px 8px;font-size:15px}
.rquest.done{display:block;border-color:var(--aqua);color:var(--aqua);text-align:center;font-family:var(--f-dot)}
.rbox{background:var(--ink);border:2px solid var(--gold);padding:6px 10px}
.rbox .label{font-size:16px;margin:0 0 4px}
.rlist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:16px}
.rst{color:var(--gold);margin-right:6px;font-size:13px}
.rnote{margin:0}
.rmems{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rmem{background:var(--ink);border:2px solid var(--slate);padding:6px 8px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rmem.low{border-color:var(--red);background:#3A1A1E}
.rmem.low .bar:not(.jp):not(.cp) i{background:var(--red)}
.rmem p{margin:0}
.rmh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.rmh b{font-size:16px}
.rbadge{font-family:var(--f-dot);font-size:12px;background:var(--gold);color:var(--ink);padding:0 4px}
.rmem .gauge{font-size:13px;grid-template-columns:5.2em 1fr auto}.rmem .gauge>span:first-child{white-space:nowrap}
.rlevel .big{font-size:22px}
.rfoot{position:sticky;bottom:calc(var(--dockH) + 8px + env(safe-area-inset-bottom,0px));z-index:2;background:linear-gradient(180deg,transparent,var(--ink) 30%);padding-top:10px}
.confirmrow .btn.auto{min-width:64px;background:var(--navy);border-color:var(--gold);color:var(--gold);font-family:var(--f-dot)}
.autopanel{border-color:var(--gold)}
.autotitle{font-family:var(--f-dot);color:var(--gold);font-size:18px;letter-spacing:.1em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.autotitle{animation:none}}
.autolast{font-size:16px;color:var(--aqua);min-height:1.4em}
.confirmrow .btn.stopauto{min-width:140px}
.quake{animation:quake .4s steps(8)}
@keyframes quake{0%{transform:translate(0,0)}12%{transform:translate(-6px,3px)}25%{transform:translate(5px,-3px)}37%{transform:translate(-4px,-2px)}50%{transform:translate(4px,3px)}62%{transform:translate(-3px,1px)}75%{transform:translate(2px,-2px)}100%{transform:none}}
.hurtflash{position:fixed;inset:0;z-index:25;pointer-events:none;background:var(--red);opacity:.28;animation:hf .26s steps(2) forwards}
@keyframes hf{to{opacity:0}}
/* 体力が最大の30%以下：ステータス欄を赤に */
.pcard.low,.pmini.low,.scard.low{border-color:var(--red)!important;background:#3A1A1E}
.pmini.low{background:transparent;color:var(--coral)}
.pcard.low .pstat,.pcard.low .pline b,.scard.low .kv dd{color:var(--coral)}
.pcard.low .bar i,.pmini.low .bar i,.scard.low .bar i{background:var(--red)}
.pstrip:has(.pmini.low){border-color:var(--red)}
@media (prefers-reduced-motion:reduce){.quake,.hurtflash{animation:none}.hurtflash{display:none}}
/* 配信 */
.meter{position:relative;height:16px;background:var(--ink);border:2px solid var(--cream)}
.meter i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,#B89A3E 8px 10px)}
.meter .line{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--coral)}
.comments{display:flex;flex-direction:column;gap:4px}
.cmt{background:var(--cream);color:var(--ink);padding:4px 8px;font-size:16px;border-left:4px solid var(--red)}
.req{font-weight:700}
.big{font-family:var(--f-dot);font-size:28px;color:var(--gold)}
.flash{position:fixed;inset:0;background:var(--cream);z-index:50;animation:fl .38s steps(4)}
@keyframes fl{0%,50%{opacity:1}25%,75%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flash,.hitfx{animation:none}}
/* 動きを止めても入力とゲーム内の時間・音量は変更しない。 */
body.reduce-motion *,body.reduce-motion *::before,body.reduce-motion *::after{animation:none!important;transition:none!important}
body.reduce-motion .flash,body.reduce-motion .hurtflash,body.reduce-motion .hitfx,body.reduce-motion .pop{display:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .flash,.hurtflash,.hitfx,.pop{display:none!important}
}
.listener-comments{position:fixed;right:max(8px,calc((100vw - 960px)/2));top:80px;width:min(280px,38vw);display:flex;flex-direction:column;gap:5px;pointer-events:none;z-index:9}
.confirmrow{grid-template-columns:minmax(0,1fr) minmax(56px,.8fr) minmax(56px,.8fr)}.confirmrow .btn{min-width:0;padding:6px;font-size:14px}.preview{min-width:0;overflow-wrap:anywhere}
.enemies{grid-template-columns:repeat(auto-fit,minmax(88px,1fr));min-height:150px}.ecard{display:flex;flex-direction:column;justify-content:center;min-width:0;align-items:stretch}.einfo{display:contents}.ecard .esprite{align-self:center;width:88px;height:88px;max-width:100%;object-fit:contain}.ecard.isboss .esprite{width:120px;height:120px}.ecard .ename{text-align:center}.ecard.down .esprite{opacity:.5}
@media(max-height:700px){.enemies{min-height:120px;grid-template-columns:repeat(auto-fit,minmax(72px,1fr))}.ecard .esprite{width:72px;height:72px}.ecard.isboss .esprite{width:96px;height:96px}}
@media(max-width:430px){.battle{height:auto;overflow:visible;min-height:calc(100dvh - var(--dockH) - 24px)}.win.cmd{flex:none;overflow:visible}.chips{overflow:visible}.log{min-height:148px}}
.listener-comment{background:rgba(16,24,32,.92);border:1px solid var(--aqua);padding:6px 8px;font-size:13px;line-height:1.4;overflow-wrap:anywhere;animation:listenerIn .18s ease-out}
.listener-comment>span{color:var(--sand);font-size:12px}.listener-comment p{margin:2px 0 0}
.dock-help{position:absolute;left:calc(50% - 32px);bottom:32px;min-height:38px;padding:4px 12px;font-size:14px;text-align:center}
select.input{font-size:16px;max-width:100%}.pet-party{width:100%;box-sizing:border-box;border-top:1px solid var(--slate);padding-top:4px}
@keyframes listenerIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){.listener-comments{top:82px;right:8px;width:150px;max-height:190px;overflow:hidden}.listener-comment{font-size:12px;padding:4px}.listener-comment>span{font-size:12px}.dock-help{bottom:40px}}
@media(max-width:300px){.menu-grid{grid-template-columns:repeat(4,1fr)}.listener-comments{width:125px;max-height:150px}.pstrip{font-size:12px}.party{gap:4px}.pcard{min-width:0}.pstat{white-space:normal;overflow:visible;overflow-wrap:anywhere}.cmdgrid{gap:3px}}
body.reduce-motion .listener-comment{animation:none}
@media(prefers-reduced-motion:reduce){.listener-comment{animation:none}}

<script>

/* タイル: T木 .草(安全) ,道(安全) ~水 #壁 w床 1/2/3危険 =橋 c屋根 */
function buildMap(w,h,ops){
  const g=[]; for(let y=0;y<h;y++){g.push(new Array(w).fill("T"));}
  for(const [t,x,y,ww,hh] of ops){ for(let j=y;j<y+hh;j++) for(let i=x;i<x+ww;i++) if(g[j]&&i>=0&&i<w) g[j][i]=t; }
  return g;
}

function nationwideBossCycle(q,index){
  const single={t:"s",p:12+q}, spread={t:"a",p:6+Math.floor(q/2)};
  const charge={t:"c",p:0}, heavy={t:index%2?"s":"a",p:10+3*q,heavy:true};
  const patterns=[
    [single,spread,charge,heavy],
    [spread,single,spread,charge,heavy],
    [single,single,charge,heavy],
    [spread,charge,heavy,single],
    [single,spread,single,charge,heavy],
    [spread,spread,charge,heavy,single]
  ];
  return patterns[index%patterns.length].map(step=>({...step}));
}

function nationalMapSeed(id){ let n=2166136261; for(const c of id){n^=c.charCodeAt(0);n=Math.imul(n,16777619);} return n>>>0; }
function nationalMapRect(tiles,t,x,y,w,h){
  for(let yy=Math.max(1,y);yy<Math.min(tiles.length-1,y+h);yy++)
    for(let xx=Math.max(1,x);xx<Math.min(tiles[yy].length-1,x+w);xx++) tiles[yy][xx]=t;
}
function nationalMapPath(tiles,from,to,t=",",wide=1,bend=false){
  let [x,y]=from; const [tx,ty]=to;
  const stamp=()=>nationalMapRect(tiles,t,x-wide+1,y-wide+1,wide*2-1,wide*2-1);
  stamp(); const goX=()=>{while(x!==tx){x+=Math.sign(tx-x);stamp();}};
  const goY=()=>{while(y!==ty){y+=Math.sign(ty-y);stamp();}};
  if(bend){goY();goX();}else{goX();goY();}
}
function nationalMapZone(tiles,tag,cx,cy,seed){
  const rx=4+seed%2,ry=3+Math.floor(seed/3)%2;
  for(let y=cy-ry;y<=cy+ry;y++) for(let x=cx-rx;x<=cx+rx;x++){
    const clipped=Math.abs(x-cx)===rx&&Math.abs(y-cy)===ry;
    if(!clipped&&tiles[y]?.[x]!==undefined&&x>0&&x<tiles[0].length-1&&y>0&&y<tiles.length-1) tiles[y][x]=tag;
  }
}

  const slots=[[-7,-3],[7,-3],[-4,-6],[4,-6],[-10,3],[10,3],[-5,3],[5,3],[-12,-8],[12,-8],[-12,0],[12,0],[-2,5],[2,5],[-7,-10],[7,-10],[-10,-5],[10,-5]];
  const objects=[];
  for(let i=0;i<residents.length;i++){
    const o={...residents[i]},[dx,dy]=slots[i]||[-12+(i%7)*4,-12-Math.floor(i/7)*2];
    o.x=Math.max(3,Math.min(w-4,cx+dx));o.y=Math.max(4,Math.min(h-3,cy+dy));
    if(["door","inn","shop"].includes(o.type)){
      nationalMapRect(town,"#",o.x-2,o.y-3,5,3);
      nationalMapRect(town,"c",o.x-2,o.y-4,5,1);
    }
    objects.push(o);
  }
  /* 中央広場、街道、街の出口をつなぐ。全サービスへ枝道を用意する。 */
  nationalMapRect(town,",",cx-2,2,5,h-5);
  nationalMapRect(town,",",1,cy-1,w-2,3);
  nationalMapRect(town,",",cx-6,cy-2,13,5);
  for(const front of houseFronts) nationalMapPath(town,[cx,cy],front,",",1,false);
  for(const o of objects) nationalMapPath(town,[cx,cy],[o.x,o.y],",",1,!!(seed%2));
  for(let i=0;i<gates.length;i++){
    const o={...gates[i],x:i%2?w-2:1,y:cy+(i>1?3:0)};
    nationalMapRect(town,",",Math.max(1,o.x-1),o.y-1,3,3);objects.push(o);
  }
  const fw=40+(seed%5)*2,fh=30+(Math.floor(seed/11)%3)*2,fx=Math.floor(fw/2);
  const entrance=[fx,fh-4],back=[fx,fh-2];
  objects.push({id:`${hub}_field_exit`,x:cx,y:1,type:"door",walk:true,fieldExit:true,label:`街の出口 → ${fieldName}（戦闘エリア）`,to:fieldId,tx:entrance[0],ty:entrance[1]});
  town[1][cx]=",";
  MAPS[hub]={...old,name:hubData.name,kind:"town",layoutVersion:MAP_LAYOUT_VERSION,w,h,tiles:town,objects,zones:{},safeAnchor:[cx,cy],fieldMap:fieldId,terrain};
  hubData.fieldMap=fieldId;
  /* 街外は海岸・川・山・森・湖・野原の6種。県ごとの寸法と曲がり方を加え、
     3探索区域へ進み、奥地のボスに至る歩ける地形を作る。 */
  const field=buildMap(fw,fh,[[".",1,1,fw-2,fh-2]]);
  if(terrain==="coast"){
    const side=seed%2;
    for(let y=1;y<fh-1;y++){
      const width=4+Math.floor((Math.sin((y+seed%11)/4)+1)*2);
      nationalMapRect(field,"~",side?fw-width-1:1,y,width,1);
    }
    for(let x=5;x<fw-5;x+=8) nationalMapRect(field,"T",x,3+(x%7),2,3);
  }else if(terrain==="river"){
    for(let y=1;y<fh-1;y++){
      const x=fx+Math.round(Math.sin((y+seed%5)/4)*4);
      nationalMapRect(field,"~",x,y,3,1);
    }
    nationalMapRect(field,"T",3,3,6,8);
    nationalMapRect(field,"T",fw-9,fh-13,6,8);
  }else if(terrain==="mountain"){
    for(let y=4;y<fh-4;y+=6){
      const length=11+(seed+y)%7;
      nationalMapRect(field,"T",(y/2)%2?2:fw-length-2,y,length,2);
      nationalMapRect(field,"T",(y/2)%2?2:fw-length,y+2,length-3,1);
    }
    nationalMapRect(field,"~",fw-10,3,6,4);
  }else if(terrain==="forest"){
    for(let y=3;y<fh-4;y+=7) for(let x=3;x<fw-4;x+=8){
      nationalMapRect(field,"T",x+(y%3),y,4,4+((seed+x)%3));
    }
    nationalMapRect(field,"~",3,fh-10,5,5);
  }else if(terrain==="lake"){
    for(let y=8;y<fh-9;y++){
      const inset=Math.abs(y-Math.floor(fh/2))>4?3:0;
      nationalMapRect(field,"~",fx-6+inset,y,13-inset*2,1);
    }
    nationalMapRect(field,"T",2,2,7,5);
    nationalMapRect(field,"T",fw-9,3,6,7);
  }else{
    for(let x=5;x<fw-5;x+=9) nationalMapRect(field,"T",x,5+(x%4),2,5+(seed%4));
    nationalMapRect(field,"~",fw-11,fh-12,7,4);
    nationalMapRect(field,"~",3,3,4,4);
  }
  const zonePoints=[
    [8+seed%4,fh-10-(seed%3)],
    [fw-10-(Math.floor(seed/3)%4),Math.floor(fh/2)+seed%3],
    [fx+Math.floor(seed/5)%5-2,7+Math.floor(seed/13)%3]
  ];
  let last=entrance;
  for(let z=0;z<3;z++){
    nationalMapPath(field,last,zonePoints[z],",",2,!!((seed+z)%2));last=zonePoints[z];
  }
  const bossPoint=[zonePoints[2][0],3];
  nationalMapPath(field,last,bossPoint,",",2,true);
  nationalMapPath(field,back,entrance,",",2);
  for(let z=0;z<3;z++) nationalMapZone(field,String(z+1),...zonePoints[z],seed+z*17);
  const fieldObjects=[];
  let bossIndex=0,towerIndex=0;
  for(const original of outdoor){
    const o={...original};
    if(o.type==="sign"){
      const zone=Math.max(0,Math.min(2,Number(String(o.area).match(/A(\d+)$/)?.[1]||1)-1));
      o.x=zonePoints[zone][0]+2;o.y=zonePoints[zone][1]+2;
    }else if(o.type==="boss"){
      o.x=bossPoint[0]+bossIndex*3;o.y=bossPoint[1];bossIndex++;
      o.label=`${BOSSES[o.boss]?.name||"地域ボス"}の待機地点（街外の奥地）`;o.walk=true;
      field[o.y][o.x]=",";
    }else{
      o.x=bossPoint[0]+towerIndex*3;o.y=1;towerIndex++;
      field[o.y][o.x]=".";
    }
    fieldObjects.push(o);
  }
  fieldObjects.push({id:`${hub}_town_exit`,x:back[0],y:back[1],type:"door",walk:true,fieldExit:true,label:`${hubData.name}へ戻る（安全な街）`,to:hub,tx:cx,ty:2});
  MAPS[fieldId]={hub,name:`${hubData.name}・街外／${fieldName}`,kind:"field",layoutVersion:MAP_LAYOUT_VERSION,w:fw,h:fh,tiles:field,objects:fieldObjects,zones:{...old.zones},safeAnchor:entrance,townMap:hub,terrain};
  NATIONAL_MAP_PAIRS[hub]={town:hub,field:fieldId,prefId,terrain};
}
/* 旧街MAPの座標は使わず、移動先の中央広場へ着く。室内からは入った扉の前へ戻す。 */
for(const m of Object.values(MAPS)) for(const o of m.objects){
  if(o.type==="gate"&&MAPS[o.to]?.kind==="town") [o.tx,o.ty]=MAPS[o.to].safeAnchor;
  if(m.kind==="in"&&o.type==="door"&&MAPS[o.to]?.kind==="town"){
    const entrance=MAPS[o.to].objects.find(x=>x.type==="door"&&x.to===Object.keys(MAPS).find(id=>MAPS[id]===m));
    if(entrance){o.tx=entrance.x;o.ty=entrance.y+1;}else [o.tx,o.ty]=MAPS[o.to].safeAnchor;
  }
}

const NAME_MAX = 12;
const HW_KANA = "｡｢｣､･ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";
const FW_KANA = "。「」、・ヲァィゥェォャュョッーアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン";
function normalizeName(raw){
  let s = raw.replace(/^[ 　]+|[ 　]+$/g,"");
  s = s.replace(/[A-Za-z0-9]/g, ch=>String.fromCharCode(ch.charCodeAt(0)+0xFEE0));

      else if(nx==="ﾟ"){ const v=(f+"゚").normalize("NFC"); if(v.length===1){ f=v; i++; } }
      out+=f; }

    else out+=ch;
  }
  return out.normalize("NFC");
}

  return Array.from(s.normalize("NFC"));
}
function nameCharOk(g){
  if(g.length>2) return false;
  if([...g].length!==1) return false;
  const c=g.codePointAt(0);
  if(c>=0x3041&&c<=0x3096) return true;
  if(c>=0x30A1&&c<=0x30FA) return true;
  if("々〆〇ーゝゞヽヾ".includes(g)) return true;
  if((c>=0xFF21&&c<=0xFF3A)||(c>=0xFF41&&c<=0xFF5A)||(c>=0xFF10&&c<=0xFF19)) return true;

}
function validateName(raw){
  const s=normalizeName(raw); const gs=graphemes(s); const errors=[];
  gs.forEach((g,i)=>{ if(!nameCharOk(g)) errors.push(`${i+1}文字目「${/\s/.test(g)?"空白":g}」は使えません（使える文字：ひらがな・カタカナ・漢字・全角英数字）。`); });
  if(gs.length===0) errors.push("名前を入力してください。");
  if(gs.length>NAME_MAX) errors.push(`${gs.length}文字です。${NAME_MAX}文字以内に直してください。`);
  return { value:s, count:gs.length, errors, ok:errors.length===0 };
}

/* ---- 戦闘オートのAI（ユーザー指定）：候補行動を複製上で試し、評価が最も高い行動を選ぶ ---- */
function aiCandidates(run, a){

/* ---- 道具袋（通常300種類・イベント400種類、各99個。あふれた分は金庫へ） ---- */

function bagKindCount(bag,event){ return bag.filter(e=>(ITEMS[e.id]?.acq==="E")===event).length; }
function bagRoom(bag,id){ const e=bag.find(x=>x.id===id); if(e) return Math.max(0,BAG_STACK-e.n); const event=ITEMS[id]?.acq==="E"; return bagKindCount(bag,event)<(event?EVENT_KINDS:BAG_KINDS)?BAG_STACK:0; }

}
function transferVaultItem(st,mode,id,n){

    }else{

    if(bagCount(st.bag,id)<n||total+n>ITEM_VAULT_MAX) return false;

function itemAmount(it, k, maxHP, V, boost){

/* 戦闘中の道具（1行動。エール・コメント連携・JPの有効行動・初撃破エール・ボス対処には数えない） */
function planItem(run,a,act,p,h){
  const it=ITEMS[act.item]; p.item=act.item; p.chain=null;
  if(!it){ p.ok=false; p.reason="道具を選んでください。"; return; }
  if(bagCount(run.bag,it.id)<=0){ p.ok=false; p.reason="その道具は持っていません。"; return; }
  const need=itemNeeds(it), V=h.V, boost=a.pouch && it.cat!=="攻撃";
  const healOne=(t)=>{ const hp=itemAmount(it,"hp",t.maxHP,V,boost); if(hp) h.heal(t,hp); const cc=itemC(it,battleMPCap(t)-t.c); if(cc) h.addC(t,cc); };
  if(need==="enemy"||need==="enemyAll"){
    const list = need==="enemy" ? [h.needEnemy()].filter(Boolean) : run.enemies.filter(e=>e.hp>0);
    if(!list.length){ p.ok=false; p.reason="対象の敵を選んでください。"; return; }
    for(const e of list){ const d=Math.max(1, it.eff[1]*V - e.def); p.dmg.push({slot:e.slot, amt:Math.min(d,e.hp), raw:d}); }
    if(need==="enemyAll") p.all=true;
  } else if(need==="ally"){ const t=h.needAlly(); if(!t){ p.ok=false; p.reason="対象を選んでください。"; return; } healOne(t); }
  else if(need==="allyAll"){ for(const t of run.party.filter(m=>m.hp>0)) healOne(t); }
  else { // 蘇生
    const downs = run.party.filter(m=>m.hp<=0);
    const list = need==="downAll" ? downs : downs.filter(m=>m.pos===act.ally);
    if(!downs.length){ p.ok=false; p.reason="戦闘不能の仲間がいません。"; return; }
    if(!list.length){ p.ok=false; p.reason="復活させる仲間を選んでください。"; return; }
    for(const t of list) p.heal.push({pos:t.pos, amt:itemAmount(it,"rev",t.maxHP,V,boost), revive:true});
  }
  const effect = p.dmg.length || p.heal.some(x=>x.amt>0||x.revive) || p.cgain.some(x=>x.amt>0);
  if(!effect){ p.ok=false; p.reason="今は効果がありません。"; return; }
  p.valid=false; p.aGain=0;
}
/* 移動中の道具（攻撃道具は使えない）。MPの上限は最大MP */
function useItemField(st, id, cid){
  const it=ITEMS[id]; if(!it) return {ok:false, reason:"道具がありません。"};

  ensureVitals(st); const L=levelOf(st.xp,st), V=Vof(L), need=itemNeeds(it);
  const all = need==="allyAll"||need==="downAll";
  const targets = all ? st.roster.slice() : [cid];
  const log=[]; let any=false;
  for(const c of targets){
    const s=charStats(st,c,L), v=st.vitals[c]; if(!v) continue; const boost=s.pouch;
    if(need==="down"||need==="downAll"){ if(v.hp>0) continue; v.hp=Math.min(s.maxHP,itemAmount(it,"rev",s.maxHP,V,boost)); any=true; log.push(`${charName(st,c)}が復活（体力${v.hp}）`); continue; }

    const hp=Math.min(itemAmount(it,"hp",s.maxHP,V,boost), s.maxHP-v.hp); const cc=Math.min(itemC(it,s.startC-v.c), s.startC-v.c);

  bagRemove(st.bag,id,1);
  return {ok:true, log};
}

  /* ---- ノイズ体 32×32（ボス64×64）：輪郭×属性の模様×エリア小物、3段の陰影 ---- */
  const SHAPES = {

      case "glyph": return (Math.abs(u)<0.78&&Math.abs(v+0.45)<0.17)||(Math.abs(u)<0.17&&Math.abs(v)<0.78)||(Math.abs(u-0.38)<0.16&&v>0&&v<0.78)||(Math.abs(v-0.2)<0.15&&Math.abs(u)<0.58);

      case "spark": { const a=Math.atan2(v,u), d=Math.hypot(u,v); return d < 0.44+0.34*Math.abs(Math.cos(a*3)); }
      case "jar": return (Math.abs(u)<0.62&&v>-0.35&&v<0.78) || (Math.abs(u)<0.32&&v<=-0.35&&v>-0.72);
      case "box": return Math.abs(u)<0.72&&Math.abs(v)<0.64;

  function enemy(profileId, species, attr, area, frame, size=32, boss=false){

    const [c,g]=mk(size,size); const S=size;
    const shape=boss?(profileId==="LB01"?"cloud":"lantern"):(SHAPES[species]||"drop");
    const [base,accent]=boss?(profileId==="LB01"?[PAL.violet,PAL.cream]:[PAL.red,PAL.gold]):(ATTR_COL[attr]||ATTR_COL["無"]);
    const hi=light(base,.35), sh=dark(base,.35), off=frame;
    const ins=(x,y)=> x>=0&&y>=0&&x<S&&y<S && inside(shape,x,y-off,S);
    // 陰影（左上から光）
    for(let y=0;y<S;y++) for(let x=0;x<S;x++){
      if(!ins(x,y)) continue;
      let col=base;
      const lightSide = !ins(x-2,y-2), darkSide = !ins(x+2,y+2);

        case "電": if(((x>>1)+(y>>1)+frame)%4===0 && y%4<2) col=accent; break;
        case "熱": if(y < S*0.45 && (x*7+y*3+frame*5)%11===0) col=accent; break;
        case "水": if((y+Math.round(2*Math.sin(x/3+frame)))%6===0) col=accent; break;
        case "風": if((x-y+64+frame*2)%9===0) col=accent; break;
        case "土": if(x%6===0||y%6===0) col=dark(base,.45); break;
        default: if(x%5===2&&y%5===2) col=accent;
      }
      if(boss && (x+y+frame)%9===0) col=accent;
      px(g,x,y,1,1,col);
    }
    // 光沢
    for(let y=0;y<S;y++){ let done=false; for(let x=0;x<S;x++){ if(ins(x,y)&&ins(x+1,y)&&ins(x,y+1)&&!ins(x-1,y-1)&&y>S*0.15){ px(g,x+1,y+1,Math.max(1,S/16),Math.max(1,S/32),PAL.cream); done=true; break; } } if(done) break; }

    cache[key]=c; return c;
  }

const SHARE = (()=>{

  const INTRO="スマホで遊べる昭和風ドットRPG『ポコチャクエスト』";

/* 表示用の時刻は保存せず、直近の文・名の重複回避だけを対象セーブへ保存する。 */
function migrateListeners(st){
  const old=st.listenerHistory||{};
  st.listenerHistory={texts:Array.isArray(old.texts)?old.texts.filter(x=>LISTENER_TEXTS.some(t=>t.id===x)).slice(-12):[],names:Array.isArray(old.names)?old.names.filter(x=>typeof x==="string").slice(-24):[],sequence:Number.isSafeInteger(old.sequence)&&old.sequence>=0?old.sequence:0};
  return st.listenerHistory;

function createListenerBatch(st,context,count=3,now=0){
  if(!LISTENER_CONTEXTS.some(([id])=>id===context)||!Number.isInteger(count)||count<1||count>5)return [];
  const h=migrateListeners(st),texts=LISTENER_TEXTS.filter(t=>t.context===context),batch=[],spacing=650+(h.sequence%8)*50;
  for(let i=0;i<count;i++){
    const available=texts.filter(t=>!h.texts.includes(t.id)),pool=available.length?available:texts;
    const text=pool[(h.sequence*7+i*3)%pool.length];
    const names=["sea","pet","boss","support"].includes(context)?[...LISTENER_SPECIAL_NAMES,...LISTENER_NAMES]:LISTENER_NAMES;
    let index=(h.sequence*37+i*17)%names.length;
    for(let tries=0;tries<names.length&&h.names.includes(names[index]);tries++)index=(index+1)%names.length;
    const name=names[index],delay=i*spacing;
    batch.push({id:`${h.sequence}-${i}`,name,text:text.text,start:now+delay,end:now+delay+5000,context});
    h.texts.push(text.id);h.texts=h.texts.slice(-12);h.names.push(name);h.names=h.names.slice(-24);h.sequence++;
  }
  return batch;
}
function visibleListenerComments(batch,now){return batch.filter(c=>now>=c.start&&now<c.end);}
const LISTENER_RUNTIME={state:null,key:"",batch:[],timer:null,last:null};
function clearListenerComments(){
  if(LISTENER_RUNTIME.timer)clearTimeout(LISTENER_RUNTIME.timer);
  LISTENER_RUNTIME.timer=null;LISTENER_RUNTIME.batch=[];LISTENER_RUNTIME.key="";
  if(typeof document!=="undefined")document.getElementById("listenerComments")?.remove();
}
function updateListenerDisplay(){
  if(LISTENER_RUNTIME.timer)clearTimeout(LISTENER_RUNTIME.timer);
  LISTENER_RUNTIME.timer=null;
  if(!G.st||G.sheet||G.dlg||document.hidden||!G.st.settings.listenerComments||!["battle","result","explore"].includes(G.screen))return;
  const now=performance.now(),visible=visibleListenerComments(LISTENER_RUNTIME.batch,now);
  let box=document.getElementById("listenerComments");
  if(!box){box=document.createElement("aside");box.id="listenerComments";box.className="listener-comments";box.setAttribute("aria-live","polite");box.setAttribute("aria-label","リスナーの応援");document.body.appendChild(box);}
  box.innerHTML=visible.map(c=>`<div class="listener-comment"><span>${esc(c.name)}</span><p>${esc(c.text)}</p></div>`).join("");
  const next=LISTENER_RUNTIME.batch.flatMap(c=>[c.start,c.end]).filter(t=>t>now).sort((a,b)=>a-b)[0];
  if(next!==undefined)LISTENER_RUNTIME.timer=setTimeout(updateListenerDisplay,Math.max(20,next-now+5));
}
function observeListenerScene(){
  if(!G.st||G.readOnly||G.sheet||G.dlg||document.hidden||G.st.settings.listenerComments===false){clearListenerComments();return;}
  const st=G.st,run=st.run,prior=LISTENER_RUNTIME.last;
  let context=G.screen==="result"?"victory":G.screen==="battle"?(run?.kind==="boss"?"boss":"start"):MAPS[st.mapId]?.combatDomain==="sea"?"sea":MAPS[st.mapId]?.kind==="field"?"explore":"town";
  if(run?.state==="lost")context="defeat";
  const hp=run?.party.reduce((n,m)=>n+m.hp,0)||0,enemyHP=run?.enemies.reduce((n,m)=>n+m.hp,0)||0;
  const key=[G.screen,st.mapId,run?.seq,run?.turn,run?.actionFlags?.actionCount,st.lastResult?.seq].join("|");
  if(prior&&prior.seq===run?.seq&&G.screen==="battle"&&run?.state!=="lost"){
    if(run.party.some(m=>m.hp<=0))context="down";else if(run.party.some(m=>m.hp<=m.maxHP*.3))context="low";
    else if(hp>prior.hp)context="heal";else if(enemyHP<prior.enemyHP)context="hit";
    else if(run.petProcessedTurn===run.turn)context="pet";else if(run.turn!==prior.turn)context="mp";
    if(run.actionFlags?.critical&&!prior.critical||run.actionFlags?.critCount>prior.critCount)context="critical";
    if(run.actionFlags?.evaded&&!prior.evaded||run.actionFlags?.evadeCount>prior.evadeCount)context="evade";
  }
  if(LISTENER_RUNTIME.state!==st){clearListenerComments();LISTENER_RUNTIME.state=st;}
  if(key!==LISTENER_RUNTIME.key){
    clearListenerComments();LISTENER_RUNTIME.key=key;
    if(st.settings.listenerComments!==false){st.settings.listenerComments=true;LISTENER_RUNTIME.batch=createListenerBatch(st,context,context==="boss"?5:context==="town"?1:3,performance.now());}
  }
  LISTENER_RUNTIME.last={seq:run?.seq,turn:run?.turn,hp,enemyHP,critical:!!run?.actionFlags?.critical,evaded:!!run?.actionFlags?.evaded,critCount:run?.actionFlags?.critCount||0,evadeCount:run?.actionFlags?.evadeCount||0};
  updateListenerDisplay();
}

/* ===== platform: 保存（IndexedDB＋世代）と排他 ===== */
const DB = (()=>{
  let db=null;
  function open(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("toplivermichi-kyushu",1); r.onupgradeneeded=()=>r.result.createObjectStore("saves"); r.onsuccess=()=>{db=r.result;res(db);}; r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); }
  async function tx(mode, fn){ if(!db) await open(); return new Promise((res,rej)=>{ const t=db.transaction("saves",mode,{durability:"strict"}); const s=t.objectStore("saves"); let out; fn(s,v=>out=v); t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
  const get=k=>tx("readonly",(s,set)=>{ const r=s.get(k); r.onsuccess=()=>set(r.result); });
  const putPair=(cur,prev)=>tx("readwrite",s=>{ if(prev) s.put(prev,"auto-prev"); s.put(cur,"auto"); });
  return { get, putPair };
})();
function checksum(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619);} return (h>>>0).toString(16); }

const G = { st:null, screen:"title", saveStatus:"未保存", readOnly:false, hasSave:false,
  walk:{path:[], prog:0, pending:null}, cv:null, vw:11, vh:9, scale:2, raf:0, lastTs:0, frame:0,
  cmd:{}, dlg:null, sheet:null, sheetData:{}, toast:null, newGame:{name:"",gender:null,composing:false,step:1},
  battleTimer:0, lastLog:[] };
let saveChain = Promise.resolve();
function commit(){
  const st=G.st; if(!st || G.readOnly) return Promise.resolve();
  if(!st.run) ensureVitals(st);
  st.saveGeneration++;
  const json=JSON.stringify(st); const rec={gen:st.saveGeneration, time:Date.now(), state:json, sum:checksum(json)};
  setSave("保存中…");
  saveChain = saveChain.then(async()=>{
    try{ const prev=await DB.get("auto"); await DB.putPair(rec, prev&&prev.gen<rec.gen?prev:null); setSave("保存済み"); return true; }
    catch(e){ try{ localStorage.setItem("tlr-kyushu-auto", JSON.stringify(rec)); setSave("保存済み（簡易保存）"); return true; }catch(e2){ setSave("未保存：この端末では保存できません。設定からバックアップを書き出してください。"); return false; } }
  });
  return saveChain;
}
async function loadSave(){
  const decode = r => { if(!r||typeof r.state!=="string"||checksum(r.state)!==r.sum) return null; try{ const state=JSON.parse(r.state); validateState(state); return state; }catch(e){ return null; } };
  let rec=null, prev=null, local=null;
  try{ rec=await DB.get("auto"); prev=await DB.get("auto-prev"); }catch(e){}
  try{ local=JSON.parse(localStorage.getItem("tlr-kyushu-auto")||"null"); }catch(e){}
  const candidates=[
    {record:rec,storage:"indexeddb",fromPrev:false},
    {record:local,storage:"local",fromPrev:false},
    {record:prev,storage:"indexeddb",fromPrev:true}
  ].map(c=>({...c,state:decode(c.record)})).filter(c=>c.state);
  candidates.sort((a,b)=>{
    const gen=c=>Number.isSafeInteger(c.state.saveGeneration)&&c.state.saveGeneration>=0?c.state.saveGeneration:Number.isSafeInteger(c.record.gen)&&c.record.gen>=0?c.record.gen:0;
    return gen(b)-gen(a);
  });
  const best=candidates[0];
  return best?{state:best.state,time:best.record.time,storage:best.storage,fromPrev:best.fromPrev}:null;
}
function setSave(t){ G.saveStatus=t; const el=document.getElementById("saveStat"); if(el) el.textContent=t; }
function acquireLock(){
  try{ if(navigator.locks){ navigator.locks.request("toplivermichi-kyushu-owner",{ifAvailable:true}, lock=>{ if(!lock){ G.readOnly=true; render(); return; } return new Promise(()=>{}); }); } }catch(e){}
}

function nearbyObjects(){ const st=G.st, m=MAPS[st.mapId]; return m.objects.filter(o=>Math.max(Math.abs(o.x-st.pos.x),Math.abs(o.y-st.pos.y))<=1 && o.type!=="tower"); }
function mountCanvas(){
  const wrap=$(".mapwrap"); const cv=$("#map"); G.cv=cv;
  // 地図以外の部品を置いた残りの高さに合わせてタイル数を決める（画面スクロールなし）
  cv.width=16; cv.height=16; cv.style.width="16px"; cv.style.height="16px";
  const A = Math.min((wrap.clientWidth||358)-8, 448), H=(wrap.clientHeight||300)-8;
  G.scale = (Math.floor(A/32)>=7 && Math.floor(H/32)>=4) ? 2 : 1;
  G.vw=Math.max(5,Math.min(14,Math.floor(A/(16*G.scale))));
  G.vh=Math.max(3,Math.min(14,Math.floor(H/(16*G.scale))));
  cv.width=G.vw*16; cv.height=G.vh*16; cv.style.width=(G.vw*16*G.scale)+"px"; cv.style.height=(G.vh*16*G.scale)+"px";
  cv.addEventListener("pointerup", onMapTap);
  drawMap(); startLoop();
}
function camera(){
  const st=G.st, m=MAPS[st.mapId]; const p=playerPixel();
  let cx=p.x+8-G.vw*8, cy=p.y+12-G.vh*8;
  cx=Math.max(0,Math.min(m.w*16-G.vw*16,cx)); cy=Math.max(0,Math.min(m.h*16-G.vh*16,cy));
  if(m.w*16<G.vw*16) cx=(m.w*16-G.vw*16)/2; if(m.h*16<G.vh*16) cy=(m.h*16-G.vh*16)/2;
  return {x:Math.round(cx),y:Math.round(cy)};
}
function playerPixel(){
  const st=G.st, w=G.walk; let x=st.pos.x*16, y=st.pos.y*16;
  if(w.path.length){ const n=w.path[0]; x+= (n.x-st.pos.x)*16*w.prog; y+=(n.y-st.pos.y)*16*w.prog; }
  return {x:Math.round(x), y:Math.round(y)};
}
function drawMap(){
  const cv=G.cv; if(!cv||!cv.isConnected) return; const g=cv.getContext("2d"); g.imageSmoothingEnabled=false;
  const st=G.st, m=MAPS[st.mapId]; const cam=camera(); const now=performance.now();
  const still=reducedMotion(); const f=still?0:Math.floor(now/320)%4, f2=still?0:Math.floor(now/600)%2;
  g.fillStyle=PAL.ink; g.fillRect(0,0,cv.width,cv.height);
  const layer=ART.mapLayer(st.mapId,f);
  const sx=Math.max(0,cam.x), sy=Math.max(0,cam.y), w=Math.min(cv.width,layer.width-sx), h=Math.min(cv.height,layer.height-sy);
  g.drawImage(layer,sx,sy,w,h,sx-cam.x,sy-cam.y,w,h);
  const sprites=[];
  for(const o of m.objects){
    let img;
    if(o.type==="npc"){ const n=NPCS[o.npc]; img = o.npc==="moe"? charSprite("moe",0,f2*2) : ART.person(o.npc,n.sprite[1],n.sprite[0],0,f2*2,{long:["akari","chiyo","misuzu"].includes(o.npc)}); }
    else if(o.type==="shop"){ const n=NPCS[o.npc]; sprites.push({y:o.y-0.1,img:ART.object("shop",0),x:o.x}); img=ART.person(o.npc,n.sprite[1],n.sprite[0],0,f2*2); }
    else if(o.type==="inn"){ sprites.push({y:o.y-0.1,img:ART.object("inn",f),x:o.x}); img=ART.person("innkeeper",PAL.slate,PAL.navy,0,f2*2); }
    else if(o.type==="box") img=ART.object(st.boxes[o.box]?"boxOpen":"box",f);
    else if(o.type==="boss"){ if(st.bossDefeated[o.boss]) continue; img=ART.object("boss",f); }
    else img=ART.object(o.fieldExit?"gate":o.type==="jobcenter"?"board":o.type,f);
    sprites.push({y:o.y,x:o.x,img});
  }
  const moving=G.walk.path.length>0; const wf=moving?Math.floor(now/166)%4:0;
  const pp=playerPixel();
  // 2人目の追従表示（表示のみ。判定は先頭だけ）
  const fol=G.fol; const lead=st.party[0], second=st.party[1];
  if(second && fol && (fol.x!==st.pos.x||fol.y!==st.pos.y||moving)){
    let fx=fol.x*16, fy=fol.y*16; let tx=fol.x, ty=fol.y;
    if(moving){ tx=st.pos.x; ty=st.pos.y; fx+=(tx-fol.x)*16*G.walk.prog; fy+=(ty-fol.y)*16*G.walk.prog; }
    const dx=(moving?tx:st.pos.x)-fol.x, dy=(moving?ty:st.pos.y)-fol.y; const fd = dy>0?0:dy<0?1:dx<0?2:dx>0?3:st.dir;
    sprites.push({y:fy/16, px:{x:Math.round(fx),y:Math.round(fy)}, img:charSprite(second,fd,moving?(wf+2)%4:0)});
  }
  sprites.push({y:pp.y/16+0.01, px:pp, img:charSprite(lead,st.dir,wf)});
  sprites.sort((a,b)=>a.y-b.y);
  for(const s of sprites){ const x=s.px?s.px.x:s.x*16, y=s.px?s.px.y:s.y*16; g.drawImage(s.img,x-cam.x,y-8-cam.y); }
  if(moving){ const d=G.walk.path[G.walk.path.length-1]; const bl=Math.floor(now/250)%2; g.strokeStyle=bl?PAL.cream:PAL.gold; g.strokeRect(d.x*16-cam.x+3.5,d.y*16-cam.y+3.5,9,9); }
}
function startLoop(){
  cancelAnimationFrame(G.raf); G.lastTs=0;
  const STEP=G.st?.settings?.moveSpeed==="fast"?110:160;
  const loop=ts=>{
    if(G.screen!=="explore"||document.hidden){ G.raf=0; return; }
    const dt = G.lastTs? Math.min(100, ts-G.lastTs) : 16; G.lastTs=ts; G.frame++;
    const w=G.walk;
    if(w.path.length && !G.dlg && !G.sheet && !G.lock){
      const n=w.path[0]; const dx=n.x-G.st.pos.x, dy=n.y-G.st.pos.y; G.st.dir = dy>0?0:dy<0?1:dx<0?2:3;
      w.prog+=dt/STEP;
      if(w.prog>=1){ w.prog=0; w.path.shift(); G.fol={...G.st.pos}; G.st.pos={x:n.x,y:n.y}; arrive(); }
    }
    drawMap();
    G.raf=requestAnimationFrame(loop);
  };
  G.raf=requestAnimationFrame(loop);
}
function bfs(m,sx,sy,goal){
  const key=(x,y)=>y*m.w+x; const prev=new Map(); const q=[[sx,sy]]; prev.set(key(sx,sy),null);
  while(q.length){ const [x,y]=q.shift(); if(goal(x,y)&&!(x===sx&&y===sy)){ const path=[]; let k=key(x,y); while(k!==key(sx,sy)){ path.unshift({x:k%m.w,y:Math.floor(k/m.w)}); k=prev.get(k);} return path; }
    for(const [dx,dy] of [[0,1],[0,-1],[-1,0],[1,0]]){ const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=m.w||ny>=m.h) continue; const k=key(nx,ny); if(prev.has(k)) continue; if(!walkable(m,nx,ny)) continue; prev.set(k,key(x,y)); q.push([nx,ny]); } }
  return null;
}
function walkTo(x,y,pending){
  const st=G.st, m=MAPS[st.mapId]; if(G.readOnly) return toast("閲覧のみのタブです。");
  let path;
  const obj=objAt(m,x,y);
  if(obj && !obj.walk){ if(Math.abs(obj.x-st.pos.x)+Math.abs(obj.y-st.pos.y)===1 || (Math.max(Math.abs(obj.x-st.pos.x),Math.abs(obj.y-st.pos.y))<=1)){ interact(obj); return; }
    path=bfs(m,st.pos.x,st.pos.y,(px,py)=>Math.abs(px-x)+Math.abs(py-y)===1); pending=obj; }
  else { if(x===st.pos.x&&y===st.pos.y) return; if(!walkable(m,x,y)) return; path=bfs(m,st.pos.x,st.pos.y,(px,py)=>px===x&&py===y); }
  if(!path) return toast("そこへは行けません。");
  G.walk.path=path; G.walk.prog=0; G.walk.pending=pending||(obj&&obj.walk?obj:null);
}
function onMapTap(e){
  if(G.sheet||G.dlg) return; const r=G.cv.getBoundingClientRect(); const cam=camera();
  const lx=(e.clientX-r.left)*(G.cv.width/r.width)+cam.x, ly=(e.clientY-r.top)*(G.cv.height/r.height)+cam.y;
  walkTo(Math.floor(lx/16), Math.floor((ly+4)/16));
}
function arrive(){
  if(!G.st||G.readOnly||G.sheet||G.dlg||G.lock||document.hidden||G.screen!=="explore"||G.st.run)return;
  const st=G.st, m=MAPS[st.mapId]; const zone=zoneAt(m,st.pos.x,st.pos.y);
  if(SND.current!==(m.kind==="field"?"field":"fukuoka")) exploreBgm();
  if(m.kind==="field" && zone){
    // 第07A・23G節：危険タイル到着ごとに1/24の独立抽選（戦えるメンバーがいない時は抽選しない）
    const canFight = st.party.some(c=>vitalOf(c).hp>0);
    if(canFight && randInt(m.encounterRate||24)===0){
      const rolls={count:randInt(2), picks:[randInt(10000),randInt(10000)]};
      G.walk.path=[]; G.walk.pending=null;
      startBattle(createFieldRun(st,zone,rolls)); return;
    }
    commit();
  }
  else keepFlush();
  const o=objAt(m,st.pos.x,st.pos.y);
  if(!G.walk.path.length){
    const pend=G.walk.pending; G.walk.pending=null;
    if(o&&o.walk) interact(o); else if(pend) interact(pend);
    commit(); refreshHere();
  } else if(o&&o.walk&&(o.type==="door")){ G.walk.path=[]; interact(o); }
  else if(!zone) refreshHere();
}
function exploreBgm(){ const st=G.st; if(!st) return SND.play("title"); const m=MAPS[st.mapId]; SND.play(m.kind==="field"?"field":"fukuoka"); }
function refreshHere(){ if(G.screen==="explore" && !G.sheet){ const el=$(".here"); if(el){ const tmp=document.createElement("div"); tmp.innerHTML=renderExplore(); const n=tmp.querySelector(".here"); el.innerHTML=n.innerHTML; } const g=$(".goal"); if(g) g.textContent=objective(); } }

function interact(o){
  const st=G.st; if(!o||G.readOnly||G.screen!=="explore"||st.run) return; G.walk.path=[]; G.walk.pending=null;
  const face=()=>{ const dx=o.x-st.pos.x, dy=o.y-st.pos.y; if(dx||dy) st.dir = Math.abs(dy)>=Math.abs(dx)?(dy>0?0:1):(dx<0?2:3); };
  face();
  switch(o.type){
    case "npc": return talkNpc(o.npc);
    case "jobcenter": return openSheet("jobcenter");
    case "shop": return openSheet("shop",{shop:o.shop, npc:o.npc, tab:"buy"});
    case "door": return travelMap(o.to,o.tx,o.ty);
    case "gate": return nationalRouteAvailable(st,curHub(),o.to)?openSheet("travel",{to:o.to,tx:o.tx,ty:o.ty,gateId:o.id}):say([["",nationalRouteUnlockReason(curHub(),o.to)]]);
    case "box": return openBox(o);
    case "sign": { const a=AREAS[o.area]; const b=Object.values(BOSSES).find(x=>x.areaId===o.area);
      return say([["案内板",`${a.name}（${o.area}）。強度q${a.q}・推奨レベル${a.q}。`+(b?`この奥に地域ボス「${b.name}」（推奨レベル${b.q}）。`:"")],["案内板",a.lore]]); }
    case "boss": return bossPrompt(o.boss);
    case "rest": return openSheet("rest");
    case "inn": return openSheet("inn",{label:o.label});
    case "board": return openSheet("party");
    case "shelf": return openSheet("record");
    case "bench": return say([["もえ",st.moeRank>=1?"ここから見る夕焼け、配信の最後に話したくなるね。":"夕焼けがきれい。……旅に出る前に、この景色を覚えておきたいな。"],[st.profile.name,"また帰ってこよう。"]]);
    case "tower": return say([["","放送塔が空へ伸びている。"]]);
    case "landmark": return say([["案内板","唐津の海辺。新しい土地の声を聞く旅が、ここから始まる。"],["もえ","街の人に、どんな景色を届けたいか聞いてみよう。"]]);
  }
}
function talkNpc(id){
  const st=G.st, n=NPCS[id], p=st.profile.name;
  if(id==="moe") return openSheet("moe");
  let lines;
  if(!st.talked[id]){ lines=n.first(p); st.talked[id]=true; unlockSide(st);
    if(n.rep) lines.push(["",`${n.name}と話した。応援者帳に記録された（親密度1）。`]); }
  else if(n.after && ((id==="akari"&&st.quests.S01==="complete")||(id==="sota"&&st.quests.S02==="complete"))) lines=n.after(p);
  else lines=n.normal(p);
  if(n.questId){ const q=QUESTS[n.questId]; lines=st.quests[n.questId]==="complete"?[[n.name,NATIONWIDE_STORIES[q.hub].resolution]]:[...lines,["",`依頼帳「${q.name}」で街外の調査を受けられます。`]]; }
  commit(); say(lines);
}
function openBox(o){
  const st=G.st; if(st.boxes[o.box]) return say([["","箱は開いている。記念カードは記録から見られます。"]]);
  const hub=o.box.slice(0,4); const rep = hub==="KY01"?"akari":"sota"; const sq = hub==="KY01"?"S01":"S02";
  const okA = o.box.endsWith("A") && st.talked[rep]; const okB = o.box.endsWith("B") && st.quests[sq]==="complete";
  if(!(okA||okB)) return say([["",o.box.endsWith("A")?`この箱は、${NPCS[rep].name}と初めて話すと開けられる。`:`この箱は、任意依頼${sq}を終えると開けられる。`]]);
  st.boxes[o.box]=true; st.tickets+=40; st.cards.push(o.box);
  const ev=ITEM_EVENTS[o.box.slice(0,4)+"-BOX-"+o.box.slice(-1)]; let extra=[];

function startBattle(run){

  run.log=[`${run.enemies.map(e=>e.display).join("と")}が現れた！`];
  startTurnCue(run);
  if(typeof petTurnStart==="function")petTurnStart(st,run);
  G.cmd={}; G.sheet=null;
  if(run.state==="won"){G.screen="battle";toResult();return;}
  commit(); SND.sfx("enc");
  if(reducedMotion()){ G.screen="battle"; render(); }
  else { const f=document.createElement("div"); f.className="flash"; document.body.appendChild(f); setTimeout(()=>{ f.remove(); G.screen="battle"; render(); },380); }

function cueText(run){
  if(!run.cue) return "";
  const kindName={guard:"2人がガード",comment:"2人が応援コメント",damage:"2人が攻撃"}[run.cue.kind];

function buildAct(a){

    return {type:"item",item:c.item}; }
  if(c.type==="skill"){
    const need=skillNeeds(a.job);
    if(need==="none") return {type:"skill"};
    if(need==="enemy") return c.target!=null?{type:"skill",target:c.target}:null;
    if(need==="ally"||need==="allyOther") return c.ally!=null?{type:"skill",ally:c.ally}:null;
    if(need==="line") return c.line?{type:"skill",line:c.line}:null;

    const jp=jpOf(st,x.cid,s.job), R=rankOf(jp,jobLimit(st,x.cid,s.job)), jpA=jpFor(R), jpB=R<999?jpFor(R+1):jpA+1;

      <div class="gauge"><span>体力</span><span class="bar"><i style="width:${pct(v.hp,s.maxHP)}%"></i></span><b>${v.hp}/${s.maxHP}</b></div>
      <div class="gauge"><span>MP</span><span class="bar cp"><i style="width:${pct(v.c,s.startC)}%"></i></span><b>${v.c}/${s.startC}</b></div>

      ${down?`<p class="small warn">戦闘不能。宿屋か蘇生の道具で回復しよう。</p>`:low?`<p class="small warn">体力わずか。回復しておこう。</p>`:""}
    </div>`; }).join("");
  const items=[...(r.items||[]).map(x=>`<li class="ritem"><span class="rst">${"★".repeat(ITEMS[x.id].stars)}</span>${esc(ITEMS[x.id].name)} ×${x.n}<span class="small">（${esc(x.why)}）</span></li>`),
    ...(r.itemsVaulted||[]).map(x=>`<li class="ritem">${esc(ITEMS[x.id].name)} ×${x.n} はアイテム金庫へ</li>`),
    ...(r.itemsKept||[]).map(x=>`<li class="warn">${esc(ITEMS[x.id].name)} ×${x.n} は袋がいっぱいのため宿屋の預かり所へ</li>`),
    ...(r.itemsLost||[]).map(x=>`<li class="warn">${esc(ITEMS[x.id].name)} ×${x.n} は金庫と預かり所もいっぱいで受け取れず</li>`)];
  const gifts=r.gifts.map(g=>`<li class="ritem">専用品「${esc(EQUIP[g].name)}」を贈られた</li>`);
  const usedItems=(r.itemsUsed||[]).map(x=>{
    const effects=[x.hp>0?`体力＋${x.hp}`:"",x.c>0?`MP＋${x.c}`:"",x.revives>0?`復帰${x.revives}人`:""].filter(Boolean);
    const actor=x.actor==="hero"||CHARS[x.actor]?`${esc(charName(st,x.actor))}：`:"";
    return `<li>${Number.isInteger(x.turn)&&x.turn>0?`${x.turn}ターン目・`:""}${actor}${esc(ITEMS[x.id]?.name||x.id)}${effects.length?`（${effects.join("・")}）`:""}</li>`;
  });
  const anyLow=st.roster.some(c=>{const v=vitalOf(c),s=charStats(st,c,L); return v.hp<=0||isLow(v.hp,s.maxHP);});
  return `<section class="result" aria-labelledby="rtitle">
    <div class="rbanner ${r.kind==="boss"?"boss":""}"><h2 id="rtitle">${title}</h2><p>${sub}</p></div>
    ${up?`<div class="rlevel"><b>レベルアップ！</b><span>レベル${r.levelBefore} → <b class="big">${r.levelAfter}</b></span>${Vof(r.levelAfter)>Vof(r.levelBefore)?`<span class="small">技能・装備・道具の効果量が上昇</span>`:""}</div>`:""}
    <div class="rgrid">${card("経験値",`＋${r.xp.toLocaleString()}`)}${card("ゴールド",`＋${r.gold.toLocaleString()}`,"gold")}${r.tickets?card("チケット",`＋${r.tickets.toLocaleString()}`):card("所持金",`${st.gold.toLocaleString()}G`)}</div>
    <div class="gauge rxp"><span>レベル${L}</span><span class="bar xp"><i style="width:${pct(xpNow,xpSpan)}%"></i></span><b>${L<levelLimit(st)?`次まで${Math.max(0,xpSpan-xpNow).toLocaleString()}`:"最大"}</b></div>
    ${r.quest?`<div class="rquest done">依頼「${r.quest} ${esc(QUESTS[r.quest].name)}」完了！</div>`:r.kills&&r.killQuest?`<div class="rquest"><span>依頼 ${r.killQuest} 討伐</span><span class="bar"><i style="width:${pct(r.killNow,r.killNeed)}%"></i></span><b>${r.killNow}/${r.killNeed}</b></div>`:""}
    ${items.length||gifts.length?`<div class="rbox"><h3 class="label">手に入れたもの</h3><ul class="rlist">${[...items,...gifts].join("")}</ul></div>`:""}

    ${(r.newBadges||[]).length?`<div class="rbox"><h3 class="label">新しい戦闘バッジ</h3><ul class="rlist">${r.newBadges.map(id=>`<li>${id} ${esc(ITEM_BADGES[id]||GROWTH_BADGES[id]||PARTY_BADGES[id]||ACTION_BADGES[id]||HEAL_BADGES[id]||MP_BADGES[id]||CHEER_BADGES[id]||SPEED_BADGES[id]||ATTACK_BADGES[id]||GUARD_BADGES[id]||DEFENSE_BADGES[id]||EXTRA_BADGES[id]||id)}</li>`).join("")}</ul></div>`:""}
    <button class="btn" data-a="openSheet" data-k="record">戦闘バッジ一覧を見る</button>
    ${r.notes.filter(n=>!/効果量が上昇/.test(n)).map(n=>`<p class="good rnote">${esc(n)}</p>`).join("")}
    <h3 class="label">仲間</h3><div class="rmems">${mem}</div>
    ${anyLow?`<p class="small warn">体力が減っている仲間がいます。次の戦闘へ持ち越すので、道具や宿屋で回復しておこう。</p>`:""}
    <div class="rfoot"><button class="btn primary wide" data-a="resultDone">探索へ</button></div></section>`;
}
function renderUsedItemHistory(result,usedItems){
  if(usedItems.length) return `<div class="rbox"><h3 class="label">この戦闘で使った道具（${usedItems.length}回）</h3><ul class="rlist">${usedItems.join("")}</ul>${result.itemsUsedKnown===true?"":`<p class="small">旧記録のため、使用履歴が一部欠けている可能性があります。</p>`}</div>`;
  return `<div class="rbox"><h3 class="label">この戦闘で使った道具</h3><p class="small">${result.itemsUsedKnown===true?"道具は使いませんでした。":"使用記録がありません（旧保存または履歴が不完全な戦闘）。"}</p></div>`;
}
function resultDone(){
  const st=G.st,r=st.lastResult; G.screen="explore"; keepFlush(); render(); exploreBgm();
  const ids=[];
  if(r?.quest){
    const Q=QUESTS[r.quest];
    if(Q.completeScene) ids.push(Q.completeScene);
    else {
      const legacy={M01:["RANK_D1"],M02:["M02_BOSS","RANK_D2"],M03:["M03_BOSS","RANK_D3"],M04:["M04_BOSS","RANK_C1"],M05:["M05_BOSS","RANK_C2"],M06:["M06_BOSS","RANK_C3"],M07:["M07_BOSS","RANK_B1"],M08:["M08_BOSS","RANK_B2"],S01:["S01_DONE"],S02:["S02_DONE"]};
      ids.push(...(legacy[r.quest]||[]));
    }
  }
  if(st.nationalClear) ids.push("NATIONWIDE_END");
  const pending=ids.filter(id=>SCENES[id]&&!st.scenes[id]);
  const next=()=>{const id=pending.shift(); if(id) playScene(id,next);}; next();
}

function renderQuests(){
  const st=G.st,hub=curHub(),safe=isSafe();
  const stat={locked:"未解放",available:"受注できる",active:"受注中",bossReady:"ボスに挑戦できる",complete:"完了"};
  const card=([id,Q])=>{
    const s=st.quests[id]||"locked",progress=["active","bossReady","complete"].includes(s)?'討伐 '+(st.qprog[id]||0)+'/'+Q.kills:'';
    let btn="";
    if(s==="available"){
      const can=!st.activeQuest&&hub===Q.hub&&safe;
      btn='<button class="btn primary" data-a="acceptQuest" data-v="'+id+'" '+(can?'':'disabled')+'>受注する</button>'+(can?'':'<p class="small">'+(st.activeQuest?'ほかの依頼を受注中です。':HUBS[Q.hub].name+'の街で受注できます。')+'</p>');
    }
    if(s==="active"||s==="bossReady") btn='<button class="btn" data-a="abandonQuest" data-v="'+id+'">放棄する</button>';
    const lock=s==="locked"?(Q.requires?'「'+QUESTS[Q.requires].name+'」の完了で解放':Q.main?'前の本編依頼の完了で解放':'街の代表と話すと解放'):'';
    return '<div class="qcard '+s+'"><div class="srow"><b>'+id+' '+esc(Q.name)+'</b><span class="tag">'+stat[s]+'</span></div><p class="small">'+esc(HUBS[Q.hub].name)+'・'+(Q.main?'本編':'任意')+' '+progress+'</p><p>'+esc(Q.goal)+'</p>'+(lock?'<p class="small">'+esc(lock)+'</p>':'')+btn+'</div>';
  };
  const entries=Object.entries(QUESTS),local=entries.filter(([id,q])=>q.hub===hub||id===st.activeQuest),other=entries.filter(([id,q])=>q.hub!==hub&&id!==st.activeQuest);
  return '<p class="small">受注は同時に1件。街で依頼を受け、出口から街外へ。地域ボスの討伐で依頼完了・報酬獲得になります。</p>'+local.map(card).join('')+'<details><summary>他の地域の依頼（'+other.length+'件）</summary>'+other.map(card).join('')+'</details>';

function itemPurchaseRoom(st,id){ return bagRoom(st.bag,id)+Math.max(0,ITEM_VAULT_MAX-itemVaultCount(st)); }
function shopOffer(st,d){
  if(!SHOPS[d.shop]||!["buy","item","sell"].includes(d.tab)||!Number.isSafeInteger(d.qty)||d.qty<1) return null;
  const id=d.item, item=Object.hasOwn(ITEMS,id), equip=Object.hasOwn(EQUIP,id);
  if(!item&&!equip) return null;
  if(d.tab==="item"&&!item||d.tab==="buy"&&!equip) return null;
  if(d.tab==="item"&&!SHOP_ITEMS.includes(id)) return null;
  if(d.tab==="buy"){
    const gifts=[...JOB_IDS.filter(j=>st.gifts.W[j]).map(j=>"JW"+j.slice(1)),...JOB_IDS.filter(j=>st.gifts.A[j]).map(j=>"JA"+j.slice(1))];
    if(!SHOPS[d.shop].items.includes(id)&&!gifts.includes(id)) return null;
  }
  const own=item?bagCount(st.bag,id):(st.owned[id]||0);
  const max=d.tab==="item"?itemPurchaseRoom(st,id):d.tab==="buy"?gearReceiveRoom(st,id):item?own:availableCount(st,id);
  const unit=d.tab==="sell"?(item?ITEMS[id].sell:Math.floor(EQUIP[id].price/2)):(item?ITEMS[id].price:EQUIP[id].price);
  return {shop:d.shop,tab:d.tab,item:id,qty:d.qty,unit,own,max,gold:st.gold};
}

function migrate(s){

  }
  if(s.vaultGold===undefined) s.vaultGold=0;

    if(s.run.actionHistoryComplete!==true || !s.run.actionFlags) s.run.actionHistoryComplete=false;
  }

    s.jobs.kayo=s.jobs.kayo||CHARS.kayo.initJob; s.jp.kayo=s.jp.kayo||{}; s.equip.kayo=s.equip.kayo||{w:null,a:null,acc:null};
    joinMember(s,"kayo");
  }
  s.settings=Object.assign({difficulty:"std",sound:soundPref(),reduceMotion:false},s.settings||{});
  s.scenes=s.scenes||{}; s.cards=s.cards||[];
  if(!s.quests.M03) s.quests.M03=s.quests.M02==="complete"||s.fukuokaClear?"available":"locked";
  if(!s.quests.M04) s.quests.M04=s.quests.M03==="complete"?"available":"locked";
  if(!s.quests.M05) s.quests.M05=s.quests.M04==="complete"?"available":"locked";
  if(!s.quests.M06) s.quests.M06=s.quests.M05==="complete"?"available":"locked";
  if(!s.quests.M07) s.quests.M07=s.quests.M06==="complete"?"available":"locked";
  if(!s.quests.M08) s.quests.M08=s.quests.M07==="complete"?"available":"locked";
  refreshMainQuests(s);
  for(const [id,q] of Object.entries(QUESTS)){
    if(s.quests[id]==="combatDone"||(q.main&&s.quests[id]!=="complete"&&s.bossDefeated?.[q.boss])) completeQuest(s,id);
  }
  refreshMainQuests(s);
  for(const j of JOIN_PLAN) if(s.visitedHubs.includes(j.hub)&&!s.roster.includes(j.cid)) joinMember(s,j.cid);
  if(s.run&&layoutChanged){
    const field=HUBS[map.hub].fieldMap;

function petUiToken(st){return checksum(JSON.stringify([st.saveGeneration,st.day,st.mapId,st.party,st.vitals,st.petState,st.bag,st.itemVault,st.gold,st.tickets]));}
function petUiAttrs(action,value,extra=""){return `data-a="${action}" data-v="${esc(value)}" data-token="${petUiToken(G.st)}" ${extra}`;}
function petUiCanEdit(){return !!G.st&&!G.readOnly&&!G.petSaving&&!G.vaultSaving&&!G.shopSaving&&G.screen==="explore"&&!G.st.run&&!G.dlg&&!G.walk.path.length&&["pets","petCare","petWalk","petTravel","petShop","petAdopt"].includes(G.sheet)&&(typeof document==="undefined"||!document.hidden);}

function petUiGains(gains={}){const labels={bond:"なつき度",fullness:"満腹",mood:"ごきげん",clean:"清潔"};return Object.entries(gains).map(([k,n])=>`${labels[k]}＋${n}`).join("・");}
function petCurrentId(){const ps=petData(G.st);return petOwned(G.st,G.sheetData.pet)?G.sheetData.pet:ps?.favorite||Object.keys(ps?.owned||{})[0];}
function petSelectedSupply(st,id,action){const owned=Object.values(PET_SUPPLIES).filter(it=>it.petSpecies===id&&it.petCare===action),saved=G.sheetData.supplies?.[action]||G.sheetData.supply;return (owned.find(it=>it.id===saved)||owned.find(it=>bagCount(st.bag,it.id)>0)||owned[0])?.id;}
async function petUiMutation(el,action){
  if(!petUiCanEdit()||!el.dataset.token||el.dataset.token!==petUiToken(G.st))return toast("状態が変わりました。ペット画面で選び直してください。");
  const st=G.st,snapshot=JSON.stringify(st);let result;
  try{result=action(st);}catch(e){const previous=JSON.parse(snapshot);for(const key of Object.keys(st))delete st[key];Object.assign(st,previous);return toast("お世話の状態を確認できませんでした。元の記録を保って選び直してください。");}
  if(!result?.ok)return toast(result?.reason||"この操作はできません。");
  G.petSaving=true;el.disabled=true;render();let saved=false;
  try{saved=await commit();}catch(e){}
  if(!saved&&G.st===st){const previous=JSON.parse(snapshot);for(const key of Object.keys(st))delete st[key];Object.assign(st,previous);}
  G.petSaving=false;
  if(G.st===st){render();if(saved){SND.sfx(result.sound||"heal");toast(result.log||petUiGains(result.gains)||"記録しました。");}else toast("保存できなかったため、用品・回数・成長値を元に戻しました。");}
  return result;
}

/* 航海の画面・操作。既存の街間移動と通常図鑑は保持する。 */
const oceanBaseWalkable=walkable,oceanBaseZoneAt=zoneAt,oceanBaseInteract=interact,oceanBaseBgm=exploreBgm,oceanBaseStartBattle=startBattle,oceanBaseSafe=isSafe,oceanBaseExplore=renderExplore;
walkable=function(m,x,y){
  if(m.combatDomain!=="sea")return oceanBaseWalkable(m,x,y);
  if(x<0||y<0||x>=m.w||y>=m.h||!"ESP".includes(m.tiles[y]?.[x]||"?"))return false;
  const o=objAt(m,x,y);return !o||!!o.walk;
};
zoneAt=function(m,x,y){
  if(m.combatDomain!=="sea")return oceanBaseZoneAt(m,x,y);
  if(!"ES".includes(m.tiles[y]?.[x]||"?"))return null;
  const o=objAt(m,x,y);return o?.walk?null:m.encountersByCell[`${x},${y}`]||null;
};
interact=function(o){
  if(o?.oceanRoute){
    if(!G.st||G.readOnly||G.screen!=="explore"||G.st.run||G.dlg||G.lock)return;
    if(!MAPS[G.st.mapId].objects.includes(o)||Math.max(Math.abs(o.x-G.st.pos.x),Math.abs(o.y-G.st.pos.y))>1)return;
    if(!oceanRouteAvailable(G.st,o.oceanRoute))return say([["港の案内人",`この航路は「${QUESTS[OCEAN_ROUTES[o.oceanRoute].quest].name}」の完了後に出航できます。港と街は安全。航路E・海辺Sでは海洋モンスターに遭遇します。`]]);
    SND.sfx("seaWave");
  }
  if(o?.type==="oceanEvent"){
    if(!G.st||G.readOnly||G.screen!=="explore"||G.st.run||G.dlg||G.lock)return;
    if(!MAPS[G.st.mapId].objects.includes(o)||Math.max(Math.abs(o.x-G.st.pos.x),Math.abs(o.y-G.st.pos.y))>1)return;
    return openSheet("ocean",{area:o.oceanArea,returnTo:"guide"});
  }
  return oceanBaseInteract(o);
};
exploreBgm=function(){const m=G.st&&MAPS[G.st.mapId];if(m?.combatDomain==="sea")return SND.play(OCEAN_ROUTES[m.oceanRoute].bgm);return oceanBaseBgm();};
startBattle=function(run){if(run?.oceanArea?currentOceanArea(G.st)!==run.oceanArea:MAPS[G.st?.mapId]?.combatDomain==="sea")return;const result=oceanBaseStartBattle(run);if(G.st?.run===run&&run?.oceanArea)SND.play("seaBattle");return result;};
isSafe=function(){const m=MAPS[G.st.mapId];return m?.combatDomain==="sea"?m.tiles[G.st.pos.y]?.[G.st.pos.x]==="P":oceanBaseSafe();};
renderExplore=function(){const html=oceanBaseExplore(),m=MAPS[G.st.mapId];return m?.combatDomain==="sea"&&isSafe()?html.replace('<span class="tag danger">街外の道</span>','<span class="tag safe">安全な港</span>'):html;};

function managementCanAct(){return !!G.st&&!G.readOnly&&!G.featureSaving&&!G.shopSaving&&!G.vaultSaving&&!G.petSaving&&!G.oceanSaving&&!G.characterSaving&&G.screen==="explore"&&!G.dlg&&!G.st.run&&!G.st.jobEvent&&!G.walk.path.length&&isSafe()&&(typeof document==="undefined"||!document.hidden);}
async function managementMutation(el,fn,{sheet=G.sheet,message="記録しました。",sound="ok"}={}){
  if(!managementCanAct()||G.sheet!==sheet||!el.dataset.token||el.dataset.token!==managementToken(G.st))return toast("状態が変わりました。現在の画面で確認し直してください。");
  const st=G.st,before=clone(st);let result;
  try{result=fn(st);}catch(e){Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,before);return toast("処理できませんでした。元の記録を保持しています。");}
  if(!result?.ok)return toast(result?.reason||"現在はこの操作を行えません。");
  G.featureSaving=true;el.disabled=true;render();let saved=false;try{saved=await commit();}catch(e){}
  if(!saved&&G.st===st){Object.keys(st).forEach(k=>delete st[k]);Object.assign(st,before);}
  G.featureSaving=false;if(G.st!==st)return false;
  if(saved){if(result.after)result.after();SND.sfx(sound);toast(result.message||message);}else toast("保存できなかったため、金額・所持品・進行を元に戻しました。");
  render();return saved;
}
function managementShopEntries(st,d){
  const shop=SHOPS[d.shop];if(!shop)return [];
  const tab=d.tab||"buy",gifts=[...JOB_IDS.filter(j=>st.gifts.W[j]).map(j=>"JW"+j.slice(1)),...JOB_IDS.filter(j=>st.gifts.A[j]).map(j=>"JA"+j.slice(1))];
  let ids=tab==="buy"?[...new Set([...shop.items,...gifts])]:tab==="item"?SHOP_ITEMS.slice():[...Object.keys(st.owned).filter(id=>st.owned[id]>0),...st.bag.filter(e=>e.n>0).map(e=>e.id)];
  const words=managementNormalize(d.query).split(/\s+/).filter(Boolean),filter=Object.hasOwn(MANAGEMENT_SHOP_FILTERS,d.filter)?d.filter:"all";
  return ids.filter(id=>Object.hasOwn(EQUIP,id)||Object.hasOwn(ITEMS,id)).filter(id=>{const it=ITEMS[id]||EQUIP[id],kind=ITEMS[id]?(it.petSupply?"pet":it.acq==="E"?"event":"item"):it.slot;return (filter==="all"||kind===filter)&&words.every(word=>managementNormalize(id+" "+it.name+" "+it.text).includes(word));});
}

function managementGearPlan(st,cid,slot,id,from=null){
  if(!st.roster.includes(cid)||!["w","a","acc"].includes(slot)||id&&!Object.hasOwn(EQUIP,id))return {ok:false,reason:"装備を選び直してください。"};
  const it=id?EQUIP[id]:null,current=charStats(st,cid,levelOf(st.xp,st));if(it&&(it.slot!==slot||it.job&&(it.job!==current.job||current.R<it.needR)))return {ok:false,reason:"職業・熟練度・部位が合いません。"};
  const next=clone(st.equip),mine=next[cid][slot]===id;
  if(from&&mine)return {ok:false,reason:"既に同じ装備です。他の人から外す必要はありません。"};
  if(from){if(from===cid||!st.roster.includes(from)||next[from][slot]!==id)return {ok:false,reason:"装備している人が変わりました。"};next[from][slot]=null;}
  else if(id&&!mine&&availableCount(st,id)<1)return {ok:false,reason:"未装備の在庫がありません。他の人から外す場合は相手を指定してください。"};
  next[cid][slot]=id||null;
  const preview={...st,equip:next},beforeCount=unequippedGearCount(st),afterCount=unequippedGearCount(preview);
  if(afterCount>UNEQUIPPED_GEAR_MAX&&afterCount>beforeCount)return {ok:false,reason:"未装備品の上限300種類を超えます。金庫へ預けてください。"};
  return {ok:true,cid,slot,id:id||null,from,equipment:next,affected:[cid,...(from?[from]:[])]};
}
function managementStatsCompare(st,cid,equip){const L=levelOf(st.xp,st),a=charStats(st,cid,L),b=charStats(st,cid,L,null,equip);const labels=[['maxHP','最大体力'],['startC','最大MP'],['strength','ちから'],['defense','身の守り'],['agility','すばやさ'],['charm','魅力']];return `<b>${esc(charName(st,cid))}</b><dl class="kv">${labels.filter(([k])=>a[k]!==undefined).map(([k,label])=>`<dt>${label}</dt><dd>${a[k]} → ${b[k]}（${b[k]-a[k]>=0?"＋":""}${b[k]-a[k]}）</dd>`).join("")}<dt>攻撃力</dt><dd>${attackPower(a,L)} → ${attackPower(b,L)}</dd><dt>防御力</dt><dd>${defensePower(a,L)} → ${defensePower(b,L)}</dd></dl>`;}

function managementExchangePreview(st,id){const it=MANAGEMENT_RARE_GEAR[id];if(!it||!Object.hasOwn(MANAGEMENT_RARE_GEAR,id))return {ok:false,reason:"交換品を選び直してください。"};const count=Object.entries(QUESTS).filter(([qid,q])=>q.main&&st.quests[qid]==="complete").length;if(count<it.quests)return {ok:false,reason:`本編依頼${it.quests}件の達成が必要です。`};if(st.tickets<it.cost)return {ok:false,reason:`チケットが${it.cost-st.tickets}枚足りません。`};if(gearReceiveRoom(st,id)<1)return {ok:false,reason:"同じ装備8個または未装備300種類の上限です。"};return {ok:true,cost:it.cost};}
function renderManagementExchange(){const st=G.st;return `<p>応援チケット${st.tickets}枚。街の店のそばで交換できます。6品とも交換専用・売却不可・廃棄不可です。</p>${Object.entries(MANAGEMENT_RARE_GEAR).map(([id,it])=>{const offer=managementExchangePreview(st,id);return `<section class="qcard"><b>${esc(it.name)}</b><p>${esc(it.text)}</p><p class="small">本編${it.quests}件・${it.cost}チケット／手元${st.owned[id]||0}個</p>${offer.ok?"":`<p class="warn">${esc(offer.reason)}</p>`}<button class="btn" data-a="managementExchangeDo" data-v="${id}" data-token="${managementToken(st)}" ${managementCanAct()&&offer.ok&&nearbyObjects().some(o=>o.type==="shop")?"":"disabled"}>${it.cost}チケットで1個交換</button></section>`;}).join("")}`;}
function renderManagementGear(){const st=G.st,d=G.sheetData,words=managementNormalize(d.query).split(/\s+/).filter(Boolean),list=Object.keys(st.owned).filter(id=>EQUIP[id]&&st.owned[id]>0&&words.every(w=>managementNormalize(EQUIP[id].name+" "+id).includes(w))),pages=Math.max(1,Math.ceil(list.length/6)),page=Math.min(Math.max(0,d.page||0),pages-1);return `<p>未装備品 ${unequippedGearCount(st)}/${UNEQUIPPED_GEAR_MAX}種類。装備中の品と交換専用品は廃棄できません。</p><input id="managementGearSearch" class="input" value="${esc(d.query||"")}" aria-label="装備名で検索"><button class="btn" data-a="managementGearSearch">検索する</button>${list.slice(page*6,page*6+6).map(id=>`<section class="qcard"><b>${esc(EQUIP[id].name)}</b><p>所持${st.owned[id]}・装備中${equippedCount(st,id)}・未装備${availableCount(st,id)}</p><button class="btn" data-a="managementDisposePreview" data-v="${id}" ${availableCount(st,id)>0&&!EQUIP[id].exchangeOnly&&EQUIP[id].discard!==false?"":"disabled"}>1個廃棄する前に確認</button></section>`).join("")||'<p>一致する装備がありません。</p>'}<div class="row3"><button class="btn" data-a="managementGearPage" data-v="${page-1}" ${page>0?"":"disabled"}>前へ</button><span>${page+1}／${pages}</span><button class="btn" data-a="managementGearPage" data-v="${page+1}" ${page+1<pages?"":"disabled"}>次へ</button></div>`;}
